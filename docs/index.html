raps the main menu\u0027s update and, once, logs the menu\u0027s controls with \u003Ccode\u003Edump_controls\u003C/code\u003E. That\u0027s how you discover the control paths your mod needs.\u003C/p\u003E\n\u003Ch2 id=\u0022examples--auction-house-everything\u0022\u003Eauction-house (everything)\u003C/h2\u003E\n\u003Cp\u003EThe workspace\u0027s \u003Ccode\u003Emods/auction-house\u003C/code\u003E is the 2.0.1 Auction House ported to 2.8. It is the large, real-world example:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EData:\u003C/strong\u003E 23 converted 2.0.1 layouts, plus a changed main menu with an AH button.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EClient (Rust):\u003C/strong\u003E\n\u003Cul\u003E\n\u003Cli\u003Etab switching, list boxes with templates, dropdowns;\u003C/li\u003E\n\u003Cli\u003Edrawing item icons and quality art in draw hooks;\u003C/li\u003E\n\u003Cli\u003Eitem tooltips;\u003C/li\u003E\n\u003Cli\u003Ean HTTP client on its own thread, with results applied on the game thread;\u003C/li\u003E\n\u003Cli\u003Erebuilding its window after the screens are torn down.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EServer (C#):\u003C/strong\u003E\n\u003Cul\u003E\n\u003Cli\u003EREST routes (\u003Ccode\u003E/ah/...\u003C/code\u003E) authenticated with the login token;\u003C/li\u003E\n\u003Cli\u003Eits own database tables (listings, credits);\u003C/li\u003E\n\u003Cli\u003Eescrowed items, item Generators for tooltips;\u003C/li\u003E\n\u003Cli\u003Eadmin commands (\u003Ccode\u003E!ah\u003C/code\u003E).\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EIts source is not part of the kit, because its data is Blizzard\u0027s 2.0.1 layouts. Ask for it if you want to study it.\u003C/p\u003E\n","text":"Examples\ngold-rate (server hook \u002B Rust client)\nexamples/gold-rate: multiplies every gold drop by settings.json\u0027s multiplier (default 3).\nFile Shows mod.json a mod with both code parts settings.json settings shared by both parts, installed next to mod.json server-src/GoldRateMod.cs IServerMod, reading settings from context.Directory, context.Hooks.OnGoldDrop, a [CommandGroup] (!goldrate, !goldrate set 5) client-src/src/lib.rs d3mod_init, reading mod_dir, wrapping UIBattlenet_Campaign_OnUpdate, find \u002B set_text on the Start Game button hello-csharp (C# client)\nexamples/hello-csharp: a client-only plugin in C#, built with NativeAOT. It wraps the main menu\u0027s update and, once, logs the menu\u0027s controls with dump_controls. That\u0027s how you discover the control paths your mod needs.\nauction-house (everything)\nThe workspace\u0027s mods/auction-house is the 2.0.1 Auction House ported to 2.8. It is the large, real-world example:\nData: 23 converted 2.0.1 layouts, plus a changed main menu with an AH button.\nClient (Rust):\ntab switching, list boxes with templates, dropdowns;\ndrawing item icons and quality art in draw hooks;\nitem tooltips;\nan HTTP client on its own thread, with results applied on the game thread;\nrebuilding its window after the screens are torn down.\nServer (C#):\nREST routes (/ah/...) authenticated with the login token;\nits own database tables (listings, credits);\nescrowed items, item Generators for tooltips;\nadmin commands (!ah).\nIts source is not part of the kit, because its data is Blizzard\u0027s 2.0.1 layouts. Ask for it if you want to study it.\n","sections":[{"id":"examples--gold-rate-server-hook-rust-client","title":"gold-rate (server hook \u002B Rust client)"},{"id":"examples--hello-csharp-c-client","title":"hello-csharp (C# client)"},{"id":"examples--auction-house-everything","title":"auction-house (everything)"}]},{"id":"changelog","title":"Changelog","html":"\u003Ch1 id=\u0022changelog\u0022\u003EChangelog\u003C/h1\u003E\n\u003Cp\u003EAPI changes, newest first. The client \u003Ccode\u003EHostApi\u003C/code\u003E only ever grows: a plugin built for version N runs on any host with version \u2265 N.\u003C/p\u003E\n\u003Ch2 id=\u0022changelog--model-import-first-version\u0022\u003E2026-11-13: model import (first version)\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003ENew command \u003Ccode\u003ED3ModTool import-gltf\u003C/code\u003E: it turns a glTF model into a new static prop (texture, appearance and actor SNOs). See \u003Ca href=\u0022#game-data--models-import-gltf\u0022\u003EGame data\u003C/a\u003E.\n\u003Cul\u003E\n\u003Cli\u003EIt reads the model (\u003Ccode\u003E.glb\u003C/code\u003E or \u003Ccode\u003E.gltf\u003C/code\u003E) and PNG textures, encodes DXT1/DXT5 with mips, and rebuilds a stock template appearance and actor around the new mesh.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWorks in the game:\u003C/strong\u003E an original test prop shows up both with \u003Ccode\u003E!spawn\u003C/code\u003E and when placed with the world editor. The template must be a ServerProp; the default is now \u003Ccode\u003E61743\u003C/code\u003E. The client ignores Environment actors sent by the server.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003EServer: the startup log now also lists mods that have game data only, installed in the game copy the server reads (see \u003Ca href=\u0022#server-api\u0022\u003EServer API\u003C/a\u003E).\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003ETexFile.Create\u003C/code\u003E: writes a texture SNO in any format the reader knows, with a mip chain. \u003Ccode\u003ECreateBgra8\u003C/code\u003E now uses it, and its output is unchanged.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\u0022changelog--ui-designer-first-version\u0022\u003E2026-11-11: UI designer (first version)\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003ED3ModTool ui-designer\u003C/code\u003E: a visual layout editor (a local web app); see \u003Ca href=\u0022#game-data--ui-designer\u0022\u003EGame data\u003C/a\u003E.\n\u003Cul\u003E\n\u003Cli\u003EIt places controls with the game\u0027s rules (\u003Ccode\u003EUiLayout.cs\u003C/code\u003E): checked against the running game\u0027s control rectangle, and all 258 stock layouts resolve.\u003C/li\u003E\n\u003Cli\u003EIt draws real textures and text: \u003Ccode\u003ETexFile.cs\u003C/code\u003E decodes the DXT formats and resolves \u003Ccode\u003EUI:\u003C/code\u003E frame names, and texts are read from the StringLists.\u003C/li\u003E\n\u003Cli\u003EThe Art tab browses and extracts the game\u0027s art as PNG.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003EDesigner: forms-designer layout (toolbox, outline with eye toggles and drag-to-reparent, categorized property grid, 8 resize handles, multi-select, zoom/pan, Preview), Group, New layout, and \u003Cstrong\u003EImport PNG\u003C/strong\u003E as a new \u003Ccode\u003E2DUI_\u003C/code\u003E texture (uncompressed BGRA8; loading in the game is still to be confirmed).\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EUiDocument\u003C/code\u003E: style strings are at entry \u002B8 (an earlier build read and wrote them at \u002B4, so redo any layout saved after editing a string value). Moved and new controls keep the stock record order (a parent before its children).\u003C/li\u003E\n\u003Cli\u003EThe \u003Ca href=\u0022#ui\u0022\u003EUI page\u003C/a\u003E now documents the real value model: one id space, value lookup order, control types, positioning and anchors, looks and animation.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EUiDocument\u003C/code\u003E: a \u003Ccode\u003E.ui\u003C/code\u003E reader and writer that is byte-exact on all 258 stock layouts. It understands every array in the format: the header array, 9 per-control arrays, and the arrays nested in 656- and 608-byte blocks.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003ED3ModTool ui-roundtrip \u0026lt;dir\u0026gt;\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003EKnown issue: the older \u003Ccode\u003Eui-clone\u003C/code\u003E and \u003Ccode\u003Eui-copy-subtree\u003C/code\u003E commands only relocate three of the per-control arrays. Use them only on layouts without the other arrays, or use the designer\u0027s Duplicate instead.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\u0022changelog--standalone-repository\u0022\u003E2026-11-11: standalone repository\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe ModKit is its own repository: the sources of the host (\u003Ccode\u003Ehost/\u003C/code\u003E), D3ModTool and D3Casc.Lib (\u003Ccode\u003Etools/\u003C/code\u003E), plus \u003Ccode\u003Escripts/build.ps1\u003C/code\u003E and \u003Ccode\u003Escripts/package.ps1\u003C/code\u003E. MIT license.\u003C/li\u003E\n\u003Cli\u003ED3ModTool has no built-in paths any more:\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003E--client\u003C/code\u003E defaults to \u003Ccode\u003E%D3_CLIENT_DIR%\u003C/code\u003E;\u003C/li\u003E\n\u003Cli\u003Ethe official install comes from \u003Ccode\u003E%D3_INSTALL_DIR%\u003C/code\u003E, or the Windows registration;\u003C/li\u003E\n\u003Cli\u003Ethe 2.0.1 MPQ folder comes from \u003Ccode\u003E--mpq\u003C/code\u003E or \u003Ccode\u003E%D3_201_MPQ_DIR%\u003C/code\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003EExample server projects find the server through \u003Ccode\u003E%D3_SERVER_DIR%\u003C/code\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\u0022changelog--modkit\u0022\u003E2026-11-11: ModKit\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EInstalled layout:\u003C/strong\u003E\n\u003Cul\u003E\n\u003Cli\u003Ethe server loads mods from \u003Ccode\u003E\u0026lt;server\u0026gt;\\Mods\u003C/code\u003E (\u003Ccode\u003E[Mods] Root\u003C/code\u003E, default \u003Ccode\u003EMods\u003C/code\u003E);\u003C/li\u003E\n\u003Cli\u003Ethe client host loads them from \u003Ccode\u003E\u0026lt;game\u0026gt;\\Mods\u003C/code\u003E, and lives in \u003Ccode\u003E\u0026lt;game\u0026gt;\\ModHost\u003C/code\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ED3ModTool\u003C/strong\u003E has new commands: \u003Ccode\u003Emod-install\u003C/code\u003E, \u003Ccode\u003Emod-uninstall\u003C/code\u003E, \u003Ccode\u003Emod-data\u003C/code\u003E, \u003Ccode\u003Emodhost-install\u003C/code\u003E and \u003Ccode\u003Edocs-build\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EServer hooks:\u003C/strong\u003E \u003Ccode\u003EServerModContext.Hooks\u003C/code\u003E, with the first hook \u003Ccode\u003EOnGoldDrop\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ESDK:\u003C/strong\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Ed3modapi\u003C/code\u003E moved into the kit (\u003Ccode\u003Esdk/rust\u003C/code\u003E);\u003C/li\u003E\n\u003Cli\u003Ethe version check is now \u0026quot;host \u2265 plugin\u0026quot; instead of an exact match;\u003C/li\u003E\n\u003Cli\u003Enew C header (\u003Ccode\u003Esdk/c/d3modapi.h\u003C/code\u003E) and C# binding (\u003Ccode\u003Esdk/csharp/D3ModApi.cs\u003C/code\u003E).\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EExamples:\u003C/strong\u003E \u003Ccode\u003Egold-rate\u003C/code\u003E and \u003Ccode\u003Ehello-csharp\u003C/code\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\u0022changelog--client-api-versions\u0022\u003EClient API versions\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EVersion\u003C/th\u003E\n\u003Cth\u003EAdded\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E7\u003C/td\u003E\n\u003Ctd\u003Edropdowns: \u003Ccode\u003Ecombo_set_items\u003C/code\u003E, \u003Ccode\u003Ecombo_select\u003C/code\u003E, \u003Ccode\u003Ecombo_selected\u003C/code\u003E, \u003Ccode\u003Ecombo_set_placeholder\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E6\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eitem_line\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E5\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eitem_name\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E4\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eshow_item_tooltip\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E3\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Edraw_texture\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E2\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eregister_draw\u003C/code\u003E, \u003Ccode\u003Econtrol_rect\u003C/code\u003E, \u003Ccode\u003Emouse_pos\u003C/code\u003E, \u003Ccode\u003Edraw_item_icon\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E1\u003C/td\u003E\n\u003Ctd\u003Elogging, handlers and wrappers, controls, text, layouts, list boxes, \u003Ccode\u003Eis_control\u003C/code\u003E, \u003Ccode\u003Elogin_token\u003C/code\u003E, \u003Ccode\u003Edump_controls\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch2 id=\u0022changelog--planned\u0022\u003EPlanned\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EMore server hooks: item drops, experience, monster spawns, player events.\u003C/li\u003E\n\u003Cli\u003EA UI designer: open, edit and create \u003Ccode\u003E.ui\u003C/code\u003E layouts visually, with texture preview.\u003C/li\u003E\n\u003Cli\u003EAsset import: skinned and animated models, more material slots (normal, glow), collision meshes.\u003C/li\u003E\n\u003C/ul\u003E\n","text":"Changelog\nAPI changes, newest first. The client HostApi only ever grows: a plugin built for version N runs on any host with version \u2265 N.\n2026-11-13: model import (first version)\nNew command D3ModTool import-gltf: it turns a glTF model into a new static prop (texture, appearance and actor SNOs). See Game data.\nIt reads the model (.glb or .gltf) and PNG textures, encodes DXT1/DXT5 with mips, and rebuilds a stock template appearance and actor around the new mesh.\nWorks in the game: an original test prop shows up both with !spawn and when placed with the world editor. The template must be a ServerProp; the default is now 61743. The client ignores Environment actors sent by the server.\nServer: the startup log now also lists mods that have game data only, installed in the game copy the server reads (see Server API).\nTexFile.Create: writes a texture SNO in any format the reader knows, with a mip chain. CreateBgra8 now uses it, and its output is unchanged.\n2026-11-11: UI designer (first version)\nD3ModTool ui-designer: a visual layout editor (a local web app); see Game data.\nIt places controls with the game\u0027s rules (UiLayout.cs): checked against the running game\u0027s control rectangle, and all 258 stock layouts resolve.\nIt draws real textures and text: TexFile.cs decodes the DXT formats and resolves UI: frame names, and texts are read from the StringLists.\nThe Art tab browses and extracts the game\u0027s art as PNG.\nDesigner: forms-designer layout (toolbox, outline with eye toggles and drag-to-reparent, categorized property grid, 8 resize handles, multi-select, zoom/pan, Preview), Group, New layout, and Import PNG as a new 2DUI_ texture (uncompressed BGRA8; loading in the game is still to be confirmed).\nUiDocument: style strings are at entry \u002B8 (an earlier build read and wrote them at \u002B4, so redo any layout saved after editing a string value). Moved and new controls keep the stock record order (a parent before its children).\nThe UI page now documents the real value model: one id space, value lookup order, control types, positioning and anchors, looks and animation.\nUiDocument: a .ui reader and writer that is byte-exact on all 258 stock layouts. It understands every array in the format: the header array, 9 per-control arrays, and the arrays nested in 656- and 608-byte blocks.\nD3ModTool ui-roundtrip \u003Cdir\u003E.\nKnown issue: the older ui-clone and ui-copy-subtree commands only relocate three of the per-control arrays. Use them only on layouts without the other arrays, or use the designer\u0027s Duplicate instead.\n2026-11-11: standalone repository\nThe ModKit is its own repository: the sources of the host (host/), D3ModTool and D3Casc.Lib (tools/), plus scripts/build.ps1 and scripts/package.ps1. MIT license.\nD3ModTool has no built-in paths any more:\n--client defaults to %D3_CLIENT_DIR%;\nthe official install comes from %D3_INSTALL_DIR%, or the Windows registration;\nthe 2.0.1 MPQ folder comes from --mpq or %D3_201_MPQ_DIR%.\nExample server projects find the server through %D3_SERVER_DIR%.\n2026-11-11: ModKit\nInstalled layout:\nthe server loads mods from \u003Cserver\u003E\\Mods ([Mods] Root, default Mods);\nthe client host loads them from \u003Cgame\u003E\\Mods, and lives in \u003Cgame\u003E\\ModHost.\nD3ModTool has new commands: mod-install, mod-uninstall, mod-data, modhost-install and docs-build.\nServer hooks: ServerModContext.Hooks, with the first hook OnGoldDrop.\nSDK:\nd3modapi moved into the kit (sdk/rust);\nthe version check is now \u0022host \u2265 plugin\u0022 instead of an exact match;\nnew C header (sdk/c/d3modapi.h) and C# binding (sdk/csharp/D3ModApi.cs).\nExamples: gold-rate and hello-csharp.\nClient API versions\nVersion Added 7 dropdowns: combo_set_items, combo_select, combo_selected, combo_set_placeholder 6 item_line 5 item_name 4 show_item_tooltip 3 draw_texture 2 register_draw, control_rect, mouse_pos, draw_item_icon 1 logging, handlers and wrappers, controls, text, layouts, list boxes, is_control, login_token, dump_controls Planned\nMore server hooks: item drops, experience, monster spawns, player events.\nA UI designer: open, edit and create .ui layouts visually, with texture preview.\nAsset import: skinned and animated models, more material slots (normal, glow), collision meshes.\n","sections":[{"id":"changelog--model-import-first-version","title":"2026-11-13: model import (first version)"},{"id":"changelog--ui-designer-first-version","title":"2026-11-11: UI designer (first version)"},{"id":"changelog--standalone-repository","title":"2026-11-11: standalone repository"},{"id":"changelog--modkit","title":"2026-11-11: ModKit"},{"id":"changelog--client-api-versions","title":"Client API versions"},{"id":"changelog--planned","title":"Planned"}]}];
const toc = document.getElementById('toc'), page = document.getElementById('page'), main = document.getElementById('main');
const results = document.getElementById('results'), search = document.getElementById('search'), nav = document.getElementById('nav');

function buildToc() {
  toc.innerHTML = DOCS.map(p => `<li><a href="#${p.id}" data-page="${p.id}">${p.title}</a>` +
    (p.sections.length ? `<ul>${p.sections.map(s => `<li><a href="#${s.id}">${s.title}</a></li>`).join('')}</ul>` : '') + '</li>').join('');
}
function show() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const pageId = hash.split('--')[0];
  const p = DOCS.find(d => d.id === pageId) || DOCS[0];
  if (page.dataset.id !== p.id) { page.innerHTML = p.html; page.dataset.id = p.id; }
  document.querySelectorAll('#toc a[data-page]').forEach(a => a.classList.toggle('active', a.dataset.page === p.id));
  const target = hash.includes('--') ? document.getElementById(hash) : null;
  if (target) target.scrollIntoView(); else main.scrollTop = 0, window.scrollTo(0, 0);
  document.title = p.title + ' – D3 ModKit Docs';
  nav.classList.remove('open');
}
function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  toc.style.display = q ? 'none' : '';
  if (!q) { results.innerHTML = ''; return; }
  const hits = [];
  for (const p of DOCS) {
    const text = p.text, lower = text.toLowerCase();
    let i = lower.indexOf(q), n = 0;
    while (i >= 0 && n < 3) {
      const a = Math.max(0, i - 50), b = Math.min(text.length, i + q.length + 70);
      const snip = esc(text.slice(a, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length, b));
      // the section the hit is in: the last "## " title before it
      let sec = null;
      for (const s of p.sections) { const at = lower.indexOf(s.title.toLowerCase()); if (at >= 0 && at <= i) sec = s; }
      hits.push(`<a href="#${sec ? sec.id : p.id}"><b>${p.title}</b>${sec ? ' › ' + sec.title : ''}<div class="snip">…${snip}…</div></a>`);
      i = lower.indexOf(q, i + q.length); n++;
    }
  }
  results.innerHTML = hits.length ? hits.slice(0, 40).join('') : '<div class="snip" style="padding:8px">No matches.</div>';
});
results.addEventListener('click', () => { search.value = ''; results.innerHTML = ''; toc.style.display = ''; });
const themeBtn = document.getElementById('theme');
function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t;
}
let theme = 'auto';
try { theme = localStorage.getItem('d3docs-theme') || 'auto'; } catch (e) {}
applyTheme(theme);
themeBtn.addEventListener('click', () => {
  theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme];
  applyTheme(theme);
  try { localStorage.setItem('d3docs-theme', theme); } catch (e) {}
});
document.getElementById('menu').addEventListener('click', () => nav.classList.toggle('open'));
window.addEventListener('hashchange', show);
buildToc(); show();
</script>
