const DOCS = [{"id":"introduction","title":"Introduction","html":"\u003Ch1 id=\u0022introduction\u0022\u003EIntroduction\u003C/h1\u003E\n\u003Cblockquote\u003E\n\u003Cp\u003E\u003Cstrong\u003ENot affiliated with Blizzard Entertainment.\u003C/strong\u003E The D3 ModKit is an independent fan project, not made, endorsed, supported or approved by Blizzard Entertainment in any way. Diablo and Diablo III are trademarks or registered trademarks of Blizzard Entertainment, Inc. The kit contains no Blizzard game data or code.\u003C/p\u003E\n\u003C/blockquote\u003E\n\u003Cp\u003EThe \u003Cstrong\u003ED3 ModKit\u003C/strong\u003E lets you change Diablo III (client \u003Cstrong\u003E2.8.0.99920\u003C/strong\u003E) running against a DiIiS/Blizzless private server, D2-mod style. You can change game rules on the server, change or add UI in the client, and ship new game data (layouts, strings, art) with your mod.\u003C/p\u003E\n\u003Cblockquote\u003E\n\u003Cp\u003EEverything here works on a \u003Cstrong\u003Ecopy\u003C/strong\u003E of the client (for example \u003Ccode\u003EF:\\D3Mods\\client\u003C/code\u003E), never on the official install, and only against a private server. Do not use the mod host on Blizzard\u0027s servers.\u003C/p\u003E\n\u003C/blockquote\u003E\n\u003Ch2 id=\u0022introduction--what-a-mod-is\u0022\u003EWhat a mod is\u003C/h2\u003E\n\u003Cp\u003EA mod is a folder with a \u003Ccode\u003Emod.json\u003C/code\u003E manifest and up to three parts. Each part is optional:\u003C/p\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EPart\u003C/th\u003E\n\u003Cth\u003EFolder\u003C/th\u003E\n\u003Cth\u003ERuns in\u003C/th\u003E\n\u003Cth\u003EWhat it can do\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EServer code\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eserver/\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe server (C# / .NET 8 assembly)\u003C/td\u003E\n\u003Ctd\u003Egame rules through \u003Ca href=\u0022#server-api--server-hooks\u0022\u003Eserver hooks\u003C/a\u003E, chat/console commands, REST routes, its own database tables\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EClient code\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eclient-code/\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe game (a native 64-bit DLL loaded by \u003Cstrong\u003ED3ModHost\u003C/strong\u003E)\u003C/td\u003E\n\u003Ctd\u003EUI handlers, new screens, drawing item icons and art, tooltips, dropdowns (\u003Ca href=\u0022#client-api\u0022\u003Eclient API\u003C/a\u003E)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EData\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Edata/\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe game\u0027s data storage (CASC), built by \u003Ccode\u003ED3ModTool\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Enew or replaced UI layouts, strings, textures and other SNO files (\u003Ca href=\u0022#game-data\u0022\u003Egame data\u003C/a\u003E)\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cp\u003EA mod may also carry its own settings files, for example \u003Ccode\u003Esettings.json\u003C/code\u003E, which both code parts can read from their installed folder.\u003C/p\u003E\n\u003Cp\u003EThe \u003Cstrong\u003EAuction House\u003C/strong\u003E mod (the 2.0.1 AH ported to 2.8) uses all three parts. The \u003Ca href=\u0022#examples\u0022\u003Eexamples\u003C/a\u003E show each part on its own.\u003C/p\u003E\n\u003Ch2 id=\u0022introduction--installed-layout\u0022\u003EInstalled layout\u003C/h2\u003E\n\u003Cp\u003EThe server and the players install mods; mod authors never edit the game or the server.\u003C/p\u003E\n\u003Cpre\u003E\u003Ccode\u003E\u0026lt;server\u0026gt;\\Blizzless.dll\n\u0026lt;server\u0026gt;\\Mods\\\u0026lt;mod id\u0026gt;\\mod.json, settings.json, server\\*.dll\n\n\u0026lt;game\u0026gt;\\x64\\Diablo III64.exe\n\u0026lt;game\u0026gt;\\ModHost\\D3ModHost.dll, d3inject.exe       the client mod host\n\u0026lt;game\u0026gt;\\Mods\\\u0026lt;mod id\u0026gt;\\mod.json, settings.json, client-code\\*.dll, data\\...\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003E\u003Ccode\u003ED3ModTool mod-install \u0026lt;modDir\u0026gt; --server \u0026lt;server\u0026gt; --client \u0026lt;game\u0026gt;\u003C/code\u003E creates this layout from a mod\u0027s source folder, and builds every installed mod\u0027s \u003Ccode\u003Edata\u003C/code\u003E into the game copy. See \u003Ca href=\u0022#tools\u0022\u003ETools\u003C/a\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022introduction--how-the-client-part-works\u0022\u003EHow the client part works\u003C/h2\u003E\n\u003Cp\u003E\u003Ccode\u003Ed3inject.exe\u003C/code\u003E starts the game suspended, loads \u003Ccode\u003ED3ModHost.dll\u003C/code\u003E into it, then lets it run. The host:\u003C/p\u003E\n\u003Col\u003E\n\u003Cli\u003Ehooks the game\u0027s UI handler lookup, so a layout can name a handler that only a mod provides;\u003C/li\u003E\n\u003Cli\u003Eloads every mod DLL in \u003Ccode\u003E\u0026lt;game\u0026gt;\\Mods\\*\\client-code\\\u003C/code\u003E and calls its \u003Ccode\u003Ed3mod_init\u003C/code\u003E;\u003C/li\u003E\n\u003Cli\u003Ehands each plugin the \u003Cstrong\u003EHostApi\u003C/strong\u003E table: find controls, set text, wrap handlers, draw icons and art, show item tooltips, fill dropdowns, and more.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cp\u003EPlugins contain \u003Cstrong\u003Eno game addresses\u003C/strong\u003E. Only the host knows the exe, so a client patch needs a new host, not new mods.\u003C/p\u003E\n\u003Cp\u003EThe host writes a log to \u003Ccode\u003E\u0026lt;game\u0026gt;\\D3ModHost.log\u003C/code\u003E. Every plugin line there is prefixed with its mod id.\u003C/p\u003E\n\u003Ch2 id=\u0022introduction--whats-in-the-kit\u0022\u003EWhat\u0027s in the kit\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EFolder\u003C/th\u003E\n\u003Cth\u003EContents\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Esdk/rust/d3modapi\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe API crate (the canonical definition)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Esdk/c/d3modapi.h\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EC/C\u002B\u002B header, and the reference layout for other languages\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Esdk/csharp/D3ModApi.cs\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EC# binding for NativeAOT plugins\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eexamples/\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Egold-rate\u003C/code\u003E (server hook \u002B Rust client), \u003Ccode\u003Ehello-csharp\u003C/code\u003E (C# client)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edocs/\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethese docs (\u003Ccode\u003Esrc/*.md\u003C/code\u003E, built to \u003Ccode\u003Eindex.html\u003C/code\u003E with \u003Ccode\u003ED3ModTool docs-build\u003C/code\u003E)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ehost/\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Esource of the client mod host (\u003Ccode\u003ED3ModHost.dll\u003C/code\u003E, \u003Ccode\u003Ed3inject.exe\u003C/code\u003E)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etools/\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Esource of \u003Ccode\u003ED3ModTool\u003C/code\u003E and \u003Ccode\u003ED3Casc.Lib\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Escripts/\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Ebuild.ps1\u003C/code\u003E builds the host, the tool and the docs; \u003Ccode\u003Epackage.ps1\u003C/code\u003E makes a binary release\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ebin/\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ein a binary release only: \u003Ccode\u003ED3ModHost.dll\u003C/code\u003E, \u003Ccode\u003Ed3inject.exe\u003C/code\u003E, \u003Ccode\u003ED3ModTool\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch2 id=\u0022introduction--requirements\u0022\u003ERequirements\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe Diablo III 2.8.0.99920 client, as a separate copy for modding.\u003C/li\u003E\n\u003Cli\u003EA DiIiS/Blizzless server with the mod loader (the \u003Ccode\u003EMods\u003C/code\u003E folder support and \u003Ccode\u003EDiIiS_NA.Mods\u003C/code\u003E API).\u003C/li\u003E\n\u003Cli\u003ETo build mods:\n\u003Cul\u003E\n\u003Cli\u003Ethe .NET 8 SDK for server parts and C# client parts;\u003C/li\u003E\n\u003Cli\u003ERust (\u003Ccode\u003Ex86_64-pc-windows-msvc\u003C/code\u003E) for Rust client parts;\u003C/li\u003E\n\u003Cli\u003Ethe MSVC build tools for C/C\u002B\u002B client parts and for C# NativeAOT.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\n","text":"Introduction\nNot affiliated with Blizzard Entertainment. The D3 ModKit is an independent fan project, not made, endorsed, supported or approved by Blizzard Entertainment in any way. Diablo and Diablo III are trademarks or registered trademarks of Blizzard Entertainment, Inc. The kit contains no Blizzard game data or code.\nThe D3 ModKit lets you change Diablo III (client 2.8.0.99920) running against a DiIiS/Blizzless private server, D2-mod style. You can change game rules on the server, change or add UI in the client, and ship new game data (layouts, strings, art) with your mod.\nEverything here works on a copy of the client (for example F:\\D3Mods\\client), never on the official install, and only against a private server. Do not use the mod host on Blizzard\u0027s servers.\nWhat a mod is\nA mod is a folder with a mod.json manifest and up to three parts. Each part is optional:\nPart Folder Runs in What it can do Server code server/ the server (C# / .NET 8 assembly) game rules through server hooks, chat/console commands, REST routes, its own database tables Client code client-code/ the game (a native 64-bit DLL loaded by D3ModHost) UI handlers, new screens, drawing item icons and art, tooltips, dropdowns (client API) Data data/ the game\u0027s data storage (CASC), built by D3ModTool new or replaced UI layouts, strings, textures and other SNO files (game data) A mod may also carry its own settings files, for example settings.json, which both code parts can read from their installed folder.\nThe Auction House mod (the 2.0.1 AH ported to 2.8) uses all three parts. The examples show each part on its own.\nInstalled layout\nThe server and the players install mods; mod authors never edit the game or the server.\nserver\\Blizzless.dll\nserver\\Mods\\mod id\\mod.json, settings.json, server\\*.dll\n\ngame\\x64\\Diablo III64.exe\ngame\\ModHost\\D3ModHost.dll, d3inject.exe       the client mod host\ngame\\Mods\\mod id\\mod.json, settings.json, client-code\\*.dll, data\\...\nD3ModTool mod-install \u003CmodDir\u003E --server \u003Cserver\u003E --client \u003Cgame\u003E creates this layout from a mod\u0027s source folder, and builds every installed mod\u0027s data into the game copy. See Tools.\nHow the client part works\nd3inject.exe starts the game suspended, loads D3ModHost.dll into it, then lets it run. The host:\nhooks the game\u0027s UI handler lookup, so a layout can name a handler that only a mod provides;\nloads every mod DLL in \u003Cgame\u003E\\Mods\\*\\client-code\\ and calls its d3mod_init;\nhands each plugin the HostApi table: find controls, set text, wrap handlers, draw icons and art, show item tooltips, fill dropdowns, and more.\nPlugins contain no game addresses. Only the host knows the exe, so a client patch needs a new host, not new mods.\nThe host writes a log to \u003Cgame\u003E\\D3ModHost.log. Every plugin line there is prefixed with its mod id.\nWhat\u0027s in the kit\nFolder Contents sdk/rust/d3modapi the API crate (the canonical definition) sdk/c/d3modapi.h C/C\u002B\u002B header, and the reference layout for other languages sdk/csharp/D3ModApi.cs C# binding for NativeAOT plugins examples/ gold-rate (server hook \u002B Rust client), hello-csharp (C# client) docs/ these docs (src/*.md, built to index.html with D3ModTool docs-build) host/ source of the client mod host (D3ModHost.dll, d3inject.exe) tools/ source of D3ModTool and D3Casc.Lib scripts/ build.ps1 builds the host, the tool and the docs; package.ps1 makes a binary release bin/ in a binary release only: D3ModHost.dll, d3inject.exe, D3ModTool Requirements\nThe Diablo III 2.8.0.99920 client, as a separate copy for modding.\nA DiIiS/Blizzless server with the mod loader (the Mods folder support and DiIiS_NA.Mods API).\nTo build mods:\nthe .NET 8 SDK for server parts and C# client parts;\nRust (x86_64-pc-windows-msvc) for Rust client parts;\nthe MSVC build tools for C/C\u002B\u002B client parts and for C# NativeAOT.\n","sections":[{"id":"introduction--what-a-mod-is","title":"What a mod is"},{"id":"introduction--installed-layout","title":"Installed layout"},{"id":"introduction--how-the-client-part-works","title":"How the client part works"},{"id":"introduction--whats-in-the-kit","title":"What\u0027s in the kit"},{"id":"introduction--requirements","title":"Requirements"}]},{"id":"getting-started","title":"Getting started","html":"\u003Ch1 id=\u0022getting-started\u0022\u003EGetting started\u003C/h1\u003E\n\u003Cp\u003EThis walks through the \u003Ccode\u003Egold-rate\u003C/code\u003E example: a mod that multiplies gold drops on the server and shows the rate on the main menu.\u003C/p\u003E\n\u003Ch2 id=\u0022getting-started--copy-the-example\u0022\u003E1. Copy the example\u003C/h2\u003E\n\u003Cp\u003ECopy \u003Ccode\u003Eexamples/gold-rate\u003C/code\u003E to a folder of your own and give it a new id in \u003Ccode\u003Emod.json\u003C/code\u003E. Ids are lower-case words with dashes, and they must be unique, because they name the installed folder.\u003C/p\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-json\u0022\u003E{\n  \u0026quot;id\u0026quot;: \u0026quot;my-gold-mod\u0026quot;,\n  \u0026quot;name\u0026quot;: \u0026quot;My Gold Mod\u0026quot;,\n  \u0026quot;version\u0026quot;: \u0026quot;1.0.0\u0026quot;,\n  \u0026quot;build\u0026quot;: \u0026quot;2.8.0.99920\u0026quot;,\n  \u0026quot;type\u0026quot;: \u0026quot;both\u0026quot;,\n  \u0026quot;server\u0026quot;: { \u0026quot;assembly\u0026quot;: \u0026quot;server/GoldRate.Server.dll\u0026quot;, \u0026quot;source\u0026quot;: \u0026quot;server-src/\u0026quot; },\n  \u0026quot;client_code\u0026quot;: { \u0026quot;dll\u0026quot;: \u0026quot;client-code/gold_rate_client.dll\u0026quot;, \u0026quot;source\u0026quot;: \u0026quot;client-src/\u0026quot; }\n}\n\u003C/code\u003E\u003C/pre\u003E\n\u003Ch2 id=\u0022getting-started--the-server-part\u0022\u003E2. The server part\u003C/h2\u003E\n\u003Cp\u003E\u003Ccode\u003Eserver-src/GoldRateMod.cs\u003C/code\u003E has one class that implements \u003Ccode\u003EIServerMod\u003C/code\u003E. The server creates it at startup and calls \u003Ccode\u003EInitialize\u003C/code\u003E:\u003C/p\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-csharp\u0022\u003Epublic void Initialize(ServerModContext context)\n{\n    // read settings.json from the installed folder, then:\n    context.Hooks.OnGoldDrop(e =\u0026gt; e.Amount = (int)Math.Round(e.Amount * Multiplier));\n}\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003EThe same assembly also defines a \u003Ccode\u003E[CommandGroup(\u0026quot;goldrate\u0026quot;, ...)]\u003C/code\u003E, so \u003Ccode\u003E!goldrate\u003C/code\u003E and \u003Ccode\u003E!goldrate set 5\u003C/code\u003E work in game chat.\u003C/p\u003E\n\u003Cp\u003EBuild it with \u003Ccode\u003Edotnet build -c Release\u003C/code\u003E. The project references \u003Ccode\u003EBlizzless.dll\u003C/code\u003E from your server folder: set the environment variable \u003Ccode\u003ED3_SERVER_DIR\u003C/code\u003E, or pass \u003Ccode\u003E/p:D3ServerDir=C:\\path\\to\\server\u003C/code\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022getting-started--the-client-part\u0022\u003E3. The client part\u003C/h2\u003E\n\u003Cp\u003E\u003Ccode\u003Eclient-src/src/lib.rs\u003C/code\u003E exports \u003Ccode\u003Ed3mod_init\u003C/code\u003E. It reads \u003Ccode\u003Esettings.json\u003C/code\u003E, then wraps the main menu\u0027s per-frame update handler:\u003C/p\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-rust\u0022\u003E#[no_mangle]\npub unsafe extern \u0026quot;C\u0026quot; fn d3mod_init(host: *const api::HostApi, mod_id: *const c_char, mod_dir: *const c_char) -\u0026gt; i32 {\n    if !api::set_api(host, mod_id) { return 1; }\n    api::register_wrapper(\u0026quot;UIBattlenet_Campaign_OnUpdate\u0026quot;, menu_update);\n    0\n}\n\nunsafe extern \u0026quot;system\u0026quot; fn menu_update(original: api::Handler, a: usize, b: usize, c: usize, d: usize) -\u0026gt; usize {\n    let result = original(a, b, c, d);          // the game\u0027s own update first\n    api::set_text(api::find(START_BUTTON), \u0026quot;Start Game (Gold x3)\u0026quot;);\n    result\n}\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003EBuild it with \u003Ccode\u003Ecargo build --release\u003C/code\u003E, then copy \u003Ccode\u003Etarget/release/gold_rate_client.dll\u003C/code\u003E to \u003Ccode\u003Eclient-code/\u003C/code\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022getting-started--install-and-run\u0022\u003E4. Install and run\u003C/h2\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-bat\u0022\u003ED3ModTool mod-install C:\\mods\\my-gold-mod --server C:\\D3Server --client F:\\D3Mods\\client\nD3ModTool modhost-install C:\\ModKit\\bin --client F:\\D3Mods\\client\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003EThe second command is only needed once per game copy.\u003C/p\u003E\n\u003Cp\u003EThen:\u003C/p\u003E\n\u003Col\u003E\n\u003Cli\u003EStart (or restart) the server. Its console shows \u003Ccode\u003EMod loaded: My Gold Mod 1.0.0 (my-gold-mod) - server code: GoldRate.Server.dll\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003EStart the game copy through the host:\n\u003Cpre\u003E\u003Ccode class=\u0022language-bat\u0022\u003EF:\\D3Mods\\client\\ModHost\\d3inject.exe \u0026quot;F:\\D3Mods\\client\\x64\\Diablo III64.exe\u0026quot; F:\\D3Mods\\client\\ModHost\\D3ModHost.dll OnlineService.SSO=true -launch -uid diablo3\n\u003C/code\u003E\u003C/pre\u003E\nA launcher can do this step for you.\u003C/li\u003E\n\u003Cli\u003EThe main menu now reads \u003Cstrong\u003ESTART GAME (GOLD X3)\u003C/strong\u003E, and \u003Ccode\u003ED3ModHost.log\u003C/code\u003E lists \u003Ccode\u003Eclient mod loaded: My Gold Mod ...\u003C/code\u003E.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Ch2 id=\u0022getting-started--iterate\u0022\u003E5. Iterate\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EClose the game before rebuilding client code. The game keeps the DLL loaded.\u003C/li\u003E\n\u003Cli\u003EStop the server before rebuilding server code, for the same reason.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003ED3ModTool mod-install\u003C/code\u003E replaces the installed folder as a whole every time.\u003C/li\u003E\n\u003Cli\u003EUse \u003Ccode\u003Eapi::log(...)\u003C/code\u003E freely. Lines go to \u003Ccode\u003ED3ModHost.log\u003C/code\u003E, prefixed with your mod id.\u003C/li\u003E\n\u003Cli\u003ETo find a control\u0027s path, call \u003Ccode\u003Eapi::dump_controls(\u0026quot;SomeText\u0026quot;)\u003C/code\u003E. It logs every registered control whose path contains the text. See \u003Ca href=\u0022#ui--finding-controls\u0022\u003EFinding controls\u003C/a\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n","text":"Getting started\nThis walks through the gold-rate example: a mod that multiplies gold drops on the server and shows the rate on the main menu.\n1. Copy the example\nCopy examples/gold-rate to a folder of your own and give it a new id in mod.json. Ids are lower-case words with dashes, and they must be unique, because they name the installed folder.\n{\n  id: my-gold-mod,\n  name: My Gold Mod,\n  version: 1.0.0,\n  build: 2.8.0.99920,\n  type: both,\n  server: { assembly: server/GoldRate.Server.dll, source: server-src/ },\n  client_code: { dll: client-code/gold_rate_client.dll, source: client-src/ }\n}\n2. The server part\nserver-src/GoldRateMod.cs has one class that implements IServerMod. The server creates it at startup and calls Initialize:\npublic void Initialize(ServerModContext context)\n{\n    // read settings.json from the installed folder, then:\n    context.Hooks.OnGoldDrop(e = e.Amount = (int)Math.Round(e.Amount * Multiplier));\n}\nThe same assembly also defines a [CommandGroup(\u0022goldrate\u0022, ...)], so !goldrate and !goldrate set 5 work in game chat.\nBuild it with dotnet build -c Release. The project references Blizzless.dll from your server folder: set the environment variable D3_SERVER_DIR, or pass /p:D3ServerDir=C:\\path\\to\\server.\n3. The client part\nclient-src/src/lib.rs exports d3mod_init. It reads settings.json, then wraps the main menu\u0027s per-frame update handler:\n#[no_mangle]\npub unsafe extern C fn d3mod_init(host: *const api::HostApi, mod_id: *const c_char, mod_dir: *const c_char) - i32 {\n    if !api::set_api(host, mod_id) { return 1; }\n    api::register_wrapper(UIBattlenet_Campaign_OnUpdate, menu_update);\n    0\n}\n\nunsafe extern system fn menu_update(original: api::Handler, a: usize, b: usize, c: usize, d: usize) - usize {\n    let result = original(a, b, c, d);          // the game\u0027s own update first\n    api::set_text(api::find(START_BUTTON), Start Game (Gold x3));\n    result\n}\nBuild it with cargo build --release, then copy target/release/gold_rate_client.dll to client-code/.\n4. Install and run\nD3ModTool mod-install C:\\mods\\my-gold-mod --server C:\\D3Server --client F:\\D3Mods\\client\nD3ModTool modhost-install C:\\ModKit\\bin --client F:\\D3Mods\\client\nThe second command is only needed once per game copy.\nThen:\nStart (or restart) the server. Its console shows Mod loaded: My Gold Mod 1.0.0 (my-gold-mod) - server code: GoldRate.Server.dll.\nStart the game copy through the host:\nF:\\D3Mods\\client\\ModHost\\d3inject.exe F:\\D3Mods\\client\\x64\\Diablo III64.exe F:\\D3Mods\\client\\ModHost\\D3ModHost.dll OnlineService.SSO=true -launch -uid diablo3\nA launcher can do this step for you.\nThe main menu now reads START GAME (GOLD X3), and D3ModHost.log lists client mod loaded: My Gold Mod ....\n5. Iterate\nClose the game before rebuilding client code. The game keeps the DLL loaded.\nStop the server before rebuilding server code, for the same reason.\nD3ModTool mod-install replaces the installed folder as a whole every time.\nUse api::log(...) freely. Lines go to D3ModHost.log, prefixed with your mod id.\nTo find a control\u0027s path, call api::dump_controls(\u0022SomeText\u0022). It logs every registered control whose path contains the text. See Finding controls.\n","sections":[{"id":"getting-started--copy-the-example","title":"1. Copy the example"},{"id":"getting-started--the-server-part","title":"2. The server part"},{"id":"getting-started--the-client-part","title":"3. The client part"},{"id":"getting-started--install-and-run","title":"4. Install and run"},{"id":"getting-started--iterate","title":"5. Iterate"}]},{"id":"mod-json","title":"mod.json reference","html":"\u003Ch1 id=\u0022mod.json-reference\u0022\u003Emod.json reference\u003C/h1\u003E\n\u003Cp\u003EEvery mod folder has a \u003Ccode\u003Emod.json\u003C/code\u003E. Comments (\u003Ccode\u003E//\u003C/code\u003E) and trailing commas are allowed. Unknown keys are ignored, so you can use \u003Ccode\u003E_comment\u003C/code\u003E keys for notes.\u003C/p\u003E\n\u003Ch2 id=\u0022mod-json--fields\u0022\u003EFields\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EKey\u003C/th\u003E\n\u003Cth\u003EType\u003C/th\u003E\n\u003Cth\u003EMeaning\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eid\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Estring\u003C/td\u003E\n\u003Ctd\u003EUnique id: lower-case, dashes. Names the installed folder \u003Ccode\u003EMods\\\u0026lt;id\u0026gt;\u003C/code\u003E. Defaults to the folder name.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ename\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Estring\u003C/td\u003E\n\u003Ctd\u003EDisplay name (logs, lists).\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eversion\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Estring\u003C/td\u003E\n\u003Ctd\u003EYour version, e.g. \u003Ccode\u003E1.2.0\u003C/code\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ebuild\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Estring\u003C/td\u003E\n\u003Ctd\u003EThe client build the mod is made for: \u003Ccode\u003E2.8.0.99920\u003C/code\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Etype\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E\u0026quot;both\u0026quot;\u003C/code\u003E | \u003Ccode\u003E\u0026quot;server\u0026quot;\u003C/code\u003E | \u003Ccode\u003E\u0026quot;client\u0026quot;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EWhich sides install it. \u003Ccode\u003Eserver\u003C/code\u003E mods are not copied to the game; \u003Ccode\u003Eclient\u003C/code\u003E mods are not copied to the server. Default \u003Ccode\u003Eboth\u003C/code\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eenabled\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ebool\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Efalse\u003C/code\u003E makes both loaders skip the mod, and the data build leave it out.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edescription\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Estring\u003C/td\u003E\n\u003Ctd\u003EFree text.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Erequires\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Estring[]\u003C/td\u003E\n\u003Ctd\u003EIds of mods that must load first (client plugins and data are ordered by this).\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eserver\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eobject\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E{\u0026quot;assembly\u0026quot;: \u0026quot;server/X.dll\u0026quot;, \u0026quot;source\u0026quot;: \u0026quot;server-src/\u0026quot;}\u003C/code\u003E: the server assembly, and where its project is. Without \u003Ccode\u003Eassembly\u003C/code\u003E, every \u003Ccode\u003Eserver\\*.dll\u003C/code\u003E is loaded.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eclient_code\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eobject\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E{\u0026quot;dll\u0026quot;: \u0026quot;client-code/x.dll\u0026quot;, \u0026quot;source\u0026quot;: \u0026quot;client-src/\u0026quot;}\u003C/code\u003E: the client plugin DLL, and its project (a \u003Ccode\u003ECargo.toml\u003C/code\u003E or a \u003Ccode\u003E.csproj\u003C/code\u003E for NativeAOT).\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eadds\u003C/code\u003E, \u003Ccode\u003Ereplaces\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Earrays\u003C/td\u003E\n\u003Ctd\u003EOptional notes listing the data files the mod adds or replaces. The build decides this from each file\u0027s SNO id; see \u003Ca href=\u0022#game-data\u0022\u003EGame data\u003C/a\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch2 id=\u0022mod-json--files-that-get-installed\u0022\u003EFiles that get installed\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EInto\u003C/th\u003E\n\u003Cth\u003EWhat\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eserver \u003Ccode\u003EMods\\\u0026lt;id\u0026gt;\\\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Emod.json\u003C/code\u003E, every top-level \u003Ccode\u003E*.json\u003C/code\u003E (settings), the folder of \u003Ccode\u003Eserver.assembly\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Egame \u003Ccode\u003EMods\\\u0026lt;id\u0026gt;\\\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Emod.json\u003C/code\u003E, every top-level \u003Ccode\u003E*.json\u003C/code\u003E, the folder of \u003Ccode\u003Eclient_code.dll\u003C/code\u003E, \u003Ccode\u003Edata\\\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cp\u003ESources, build scripts and notes are never installed.\u003C/p\u003E\n\u003Ch2 id=\u0022mod-json--settings\u0022\u003ESettings\u003C/h2\u003E\n\u003Cp\u003EPut mod settings in a top-level JSON file, for example \u003Ccode\u003Esettings.json\u003C/code\u003E. Both parts read it from their installed folder:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003Eserver: \u003Ccode\u003EServerModContext.Directory\u003C/code\u003E;\u003C/li\u003E\n\u003Cli\u003Eclient: the \u003Ccode\u003Emod_dir\u003C/code\u003E argument of \u003Ccode\u003Ed3mod_init\u003C/code\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EA server owner edits \u003Ccode\u003E\u0026lt;server\u0026gt;\\Mods\\\u0026lt;id\u0026gt;\\settings.json\u003C/code\u003E and restarts the server.\u003C/p\u003E\n\u003Ch2 id=\u0022mod-json--disabling-a-mod\u0022\u003EDisabling a mod\u003C/h2\u003E\n\u003Cp\u003EUse any of these:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003Eset \u003Ccode\u003E\u0026quot;enabled\u0026quot;: false\u003C/code\u003E in the installed \u003Ccode\u003Emod.json\u003C/code\u003E;\u003C/li\u003E\n\u003Cli\u003Eremove the folder with \u003Ccode\u003ED3ModTool mod-uninstall \u0026lt;id\u0026gt; --server ... --client ...\u003C/code\u003E;\u003C/li\u003E\n\u003Cli\u003Eclient only: set the environment variable \u003Ccode\u003ED3MODS_DISABLE=id1,id2\u003C/code\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n","text":"mod.json reference\nEvery mod folder has a mod.json. Comments (//) and trailing commas are allowed. Unknown keys are ignored, so you can use _comment keys for notes.\nFields\nKey Type Meaning id string Unique id: lower-case, dashes. Names the installed folder Mods\\\u003Cid\u003E. Defaults to the folder name. name string Display name (logs, lists). version string Your version, e.g. 1.2.0. build string The client build the mod is made for: 2.8.0.99920. type \u0022both\u0022 | \u0022server\u0022 | \u0022client\u0022 Which sides install it. server mods are not copied to the game; client mods are not copied to the server. Default both. enabled bool false makes both loaders skip the mod, and the data build leave it out. description string Free text. requires string[] Ids of mods that must load first (client plugins and data are ordered by this). server object {\u0022assembly\u0022: \u0022server/X.dll\u0022, \u0022source\u0022: \u0022server-src/\u0022}: the server assembly, and where its project is. Without assembly, every server\\*.dll is loaded. client_code object {\u0022dll\u0022: \u0022client-code/x.dll\u0022, \u0022source\u0022: \u0022client-src/\u0022}: the client plugin DLL, and its project (a Cargo.toml or a .csproj for NativeAOT). adds, replaces arrays Optional notes listing the data files the mod adds or replaces. The build decides this from each file\u0027s SNO id; see Game data. Files that get installed\nInto What server Mods\\\u003Cid\u003E\\ mod.json, every top-level *.json (settings), the folder of server.assembly game Mods\\\u003Cid\u003E\\ mod.json, every top-level *.json, the folder of client_code.dll, data\\ Sources, build scripts and notes are never installed.\nSettings\nPut mod settings in a top-level JSON file, for example settings.json. Both parts read it from their installed folder:\nserver: ServerModContext.Directory;\nclient: the mod_dir argument of d3mod_init.\nA server owner edits \u003Cserver\u003E\\Mods\\\u003Cid\u003E\\settings.json and restarts the server.\nDisabling a mod\nUse any of these:\nset \u0022enabled\u0022: false in the installed mod.json;\nremove the folder with D3ModTool mod-uninstall \u003Cid\u003E --server ... --client ...;\nclient only: set the environment variable D3MODS_DISABLE=id1,id2.\n","sections":[{"id":"mod-json--fields","title":"Fields"},{"id":"mod-json--files-that-get-installed","title":"Files that get installed"},{"id":"mod-json--settings","title":"Settings"},{"id":"mod-json--disabling-a-mod","title":"Disabling a mod"}]},{"id":"client-api","title":"Client API reference","html":"\u003Ch1 id=\u0022client-api-reference\u0022\u003EClient API reference\u003C/h1\u003E\n\u003Cp\u003EThe host passes plugins a \u003Ccode\u003EHostApi\u003C/code\u003E table (C: \u003Ccode\u003ED3HostApi\u003C/code\u003E, C#: \u003Ccode\u003ED3HostApi\u003C/code\u003E). This page lists every entry, with the Rust wrapper from \u003Ccode\u003Ed3modapi\u003C/code\u003E in brackets. \u003Cstrong\u003EAPI version: 7.\u003C/strong\u003E\u003C/p\u003E\n\u003Cblockquote\u003E\n\u003Cp\u003E\u003Cstrong\u003ECompatibility.\u003C/strong\u003E Entries are only ever appended to the end of the table, with the version raised by one. Nothing is removed or reordered. A plugin checks \u003Ccode\u003Eapi-\u0026gt;version \u0026gt;= the version it was built for\u003C/code\u003E, so newer hosts run older plugins.\u003C/p\u003E\n\u003C/blockquote\u003E\n\u003Ch2 id=\u0022client-api--entry-point\u0022\u003EEntry point\u003C/h2\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-c\u0022\u003Eint32_t d3mod_init(const D3HostApi *api, const char *mod_id, const char *mod_dir);\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe host calls it \u003Cstrong\u003Eonce\u003C/strong\u003E, on the game thread, before the game resolves any UI handler.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Emod_id\u003C/code\u003E is your id from \u003Ccode\u003Emod.json\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Emod_dir\u003C/code\u003E is your installed folder: read your settings and files from there.\u003C/li\u003E\n\u003Cli\u003EReturn \u003Ccode\u003E0\u003C/code\u003E on success. Any other value means \u0026quot;not loaded\u0026quot;, and the host logs the code.\u003C/li\u003E\n\u003Cli\u003ERust: call \u003Ccode\u003Ed3modapi::set_api(api, mod_id)\u003C/code\u003E first; it returns \u003Ccode\u003Efalse\u003C/code\u003E if the host is too old.\u003C/li\u003E\n\u003Cli\u003EC#: call \u003Ccode\u003ED3.Init(api, modId)\u003C/code\u003E first.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003E\u003Cstrong\u003EThreading.\u003C/strong\u003E Every API function must be called on the game thread: from \u003Ccode\u003Ed3mod_init\u003C/code\u003E, a UI handler, a wrapper or a draw hook. To do slow work (network, files), use your own thread, then apply the results from a handler that runs every frame, such as a wrapped \u003Ccode\u003E..._OnUpdate\u003C/code\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022client-api--types\u0022\u003ETypes\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EType\u003C/th\u003E\n\u003Cth\u003EMeaning\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EControl\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EAn opaque pointer to a game UI control. \u003Ccode\u003Enull\u003C/code\u003E = not found. Every Rust wrapper is null-safe.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EHandler\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Efn(rcx, rdx, r8, r9) -\u0026gt; usize\u003C/code\u003E: a UI handler as the game calls it. For click handlers, \u003Ccode\u003Ercx\u003C/code\u003E is the clicked control\u0027s handle (compare it with \u003Ccode\u003Eis_control\u003C/code\u003E).\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EWrapper\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Efn(original, rcx, rdx, r8, r9) -\u0026gt; usize\u003C/code\u003E: wraps a handler the game has. Call \u003Ccode\u003Eoriginal\u003C/code\u003E to keep the game\u0027s behaviour.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EDrawFn\u003C/code\u003E / \u003Ccode\u003EDrawWrapper\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Efn(flag, depth) -\u0026gt; usize\u003C/code\u003E / \u003Ccode\u003Efn(original, flag, depth)\u003C/code\u003E: draw hooks, see \u003Ca href=\u0022#ui--drawing\u0022\u003EDrawing\u003C/a\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Erect\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003E[left, top, right, bottom]\u003C/code\u003E in \u003Cstrong\u003EUI units\u003C/strong\u003E: the screen is 1600 \u00D7 1200 at any resolution; the host maps them to pixels.\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch2 id=\u0022client-api--version-1-handlers-and-controls\u0022\u003EVersion 1: handlers and controls\u003C/h2\u003E\n\u003Ch3 id=\u0022client-api--log\u0022\u003Elog\u003C/h3\u003E\n\u003Cp\u003E\u003Ccode\u003Evoid log(const char *line)\u003C/code\u003E [\u003Ccode\u003Elog(\u0026amp;str)\u003C/code\u003E]\u003C/p\u003E\n\u003Cp\u003EWrites one line to \u003Ccode\u003E\u0026lt;game\u0026gt;\\D3ModHost.log\u003C/code\u003E. The Rust and C# wrappers prefix your mod id.\u003C/p\u003E\n\u003Ch3 id=\u0022client-api--register_handler\u0022\u003Eregister_handler\u003C/h3\u003E\n\u003Cp\u003E\u003Ccode\u003Eint32_t register_handler(const char *name, Handler f)\u003C/code\u003E [\u003Ccode\u003Eregister_handler(name, f) -\u0026gt; bool\u003C/code\u003E]\u003C/p\u003E\n\u003Cp\u003EProvides a UI handler name that the exe \u003Cstrong\u003Edoes not\u003C/strong\u003E have. Use it for handlers your own layouts name, or 2.0.1 names in ported layouts. Returns 0 on success, or 1 if another mod already registered the name; the first registration wins. If the exe \u003Cem\u003Edoes\u003C/em\u003E have the name, your handler is not used and the host logs a hint to use a wrapper.\u003C/p\u003E\n\u003Ch3 id=\u0022client-api--register_wrapper\u0022\u003Eregister_wrapper\u003C/h3\u003E\n\u003Cp\u003E\u003Ccode\u003Eint32_t register_wrapper(const char *name, Wrapper w)\u003C/code\u003E [\u003Ccode\u003Eregister_wrapper(name, w) -\u0026gt; bool\u003C/code\u003E]\u003C/p\u003E\n\u003Cp\u003EWraps a handler the exe \u003Cstrong\u003Edoes\u003C/strong\u003E have. Your wrapper runs instead and receives the original. Several mods can wrap the same name: they chain in load order, and the first one registered is the innermost. There are 32 wrapper slots in total.\u003C/p\u003E\n\u003Ch3 id=\u0022client-api--find_control\u0022\u003Efind_control\u003C/h3\u003E\n\u003Cp\u003E\u003Ccode\u003EControl find_control(const char *full_path)\u003C/code\u003E [\u003Ccode\u003Efind(path)\u003C/code\u003E]\u003C/p\u003E\n\u003Cp\u003EA control by its full path, for example \u003Ccode\u003ERoot.NormalLayer.BattleNetCampaign_main.LayoutRoot.Menu.PlayGameButton\u003C/code\u003E. Returns null when it does not exist, for example when the screen is not built yet.\u003C/p\u003E\n\u003Ch3 id=\u0022client-api--child_of\u0022\u003Echild_of\u003C/h3\u003E\n\u003Cp\u003E\u003Ccode\u003EControl child_of(Control c, const char *relative)\u003C/code\u003E [\u003Ccode\u003Echild(c, \u0026quot;.Child.Grandchild\u0026quot;)\u003C/code\u003E]\u003C/p\u003E\n\u003Cp\u003EA descendant by relative path, starting with a dot. Works for list rows and template instances, where full paths are not registered.\u003C/p\u003E\n\u003Ch3 id=\u0022client-api--set_visible-set_text-get_text\u0022\u003Eset_visible / set_text / get_text\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Evoid set_visible(Control, int32_t)\u003C/code\u003E [\u003Ccode\u003Eshow(c, bool)\u003C/code\u003E]\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Evoid set_text(Control, const char *utf8)\u003C/code\u003E [\u003Ccode\u003Eset_text(c, \u0026amp;str)\u003C/code\u003E]\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Eintptr_t get_text(Control, uint8_t *buf, size_t len)\u003C/code\u003E [\u003Ccode\u003Eget_text(c) -\u0026gt; Option\u0026lt;String\u0026gt;\u003C/code\u003E]: returns the length, or -1.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EText can carry the game\u0027s markup, for example \u003Ccode\u003E{icon:gold}\u003C/code\u003E, \u003Ccode\u003E{c:ff99bbff}colored{/c}\u003C/code\u003E and \u003Ccode\u003E\\n\u003C/code\u003E. \u003Ccode\u003Eset_text\u003C/code\u003E leaves dropdowns alone; use the combo functions for those.\u003C/p\u003E\n\u003Ch3 id=\u0022client-api--pin_sno-create_layout\u0022\u003Epin_sno / create_layout\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Evoid pin_sno(int32_t sno)\u003C/code\u003E [\u003Ccode\u003Epin_sno\u003C/code\u003E]\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EControl create_layout(int32_t sno)\u003C/code\u003E [\u003Ccode\u003Ecreate_layout(sno)\u003C/code\u003E]\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EBuilds a UI layout SNO (yours from \u003Ccode\u003Edata/\u003C/code\u003E, or a stock one) into \u003Ccode\u003ERoot.NormalLayer\u003C/code\u003E, registered as \u003Ccode\u003ERoot.NormalLayer.\u0026lt;LayoutName\u0026gt;_main\u003C/code\u003E. A layout that another layout uses as a template must be pinned before the outer one is built.\u003C/p\u003E\n\u003Cp\u003E\u003Cstrong\u003EScreens are torn down when the player joins or leaves a game.\u003C/strong\u003E Check with \u003Ccode\u003Efind(...)\u003C/code\u003E whether your root still exists, and rebuild it if not. Reset any cached row counts when you do.\u003C/p\u003E\n\u003Ch3 id=\u0022client-api--list_add_item-list_get_item\u0022\u003Elist_add_item / list_get_item\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Eint32_t list_add_item(Control list)\u003C/code\u003E [\u003Ccode\u003Elist_add\u003C/code\u003E]: adds a row from the list box\u0027s template and returns its index.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EControl list_get_item(Control list, int32_t index)\u003C/code\u003E [\u003Ccode\u003Elist_get\u003C/code\u003E]\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EWorks on list boxes (control type 13). \u003Cstrong\u003EOnly address rows you created:\u003C/strong\u003E \u003Ccode\u003Elist_get_item\u003C/code\u003E on a missing index returns garbage, which crashes when used. Keep your own row count.\u003C/p\u003E\n\u003Ch3 id=\u0022client-api--is_control\u0022\u003Eis_control\u003C/h3\u003E\n\u003Cp\u003E\u003Ccode\u003Eint32_t is_control(uintptr_t handler_rcx, Control c)\u003C/code\u003E [\u003Ccode\u003Eis_control(rcx, c) -\u0026gt; bool\u003C/code\u003E]\u003C/p\u003E\n\u003Cp\u003EWhether a click handler\u0027s \u003Ccode\u003Ercx\u003C/code\u003E is this control. Use it to tell which list row\u0027s button was clicked.\u003C/p\u003E\n\u003Ch3 id=\u0022client-api--login_token\u0022\u003Elogin_token\u003C/h3\u003E\n\u003Cp\u003E\u003Ccode\u003Eintptr_t login_token(uint8_t *buf, size_t len)\u003C/code\u003E [\u003Ccode\u003Elogin_token()\u003C/code\u003E]\u003C/p\u003E\n\u003Cp\u003EThe player\u0027s login token, used to authenticate your mod\u0027s REST calls to its server part. \u003Cstrong\u003EIt contains the password: only send it in a POST body\u003C/strong\u003E to your own server, and never log it.\u003C/p\u003E\n\u003Ch3 id=\u0022client-api--dump_controls\u0022\u003Edump_controls\u003C/h3\u003E\n\u003Cp\u003E\u003Ccode\u003Evoid dump_controls(const char *needle)\u003C/code\u003E [\u003Ccode\u003Edump_controls(\u0026amp;str)\u003C/code\u003E]\u003C/p\u003E\n\u003Cp\u003EDiagnostics: logs up to 80 registered controls whose stored path contains \u003Ccode\u003Eneedle\u003C/code\u003E, plus a total. See \u003Ca href=\u0022#ui--finding-controls\u0022\u003EFinding controls\u003C/a\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022client-api--version-2-drawing\u0022\u003EVersion 2: drawing\u003C/h2\u003E\n\u003Cp\u003EThese work only \u003Cstrong\u003Einside a draw hook\u003C/strong\u003E; see \u003Ca href=\u0022#ui--drawing\u0022\u003EDrawing\u003C/a\u003E.\u003C/p\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EEntry\u003C/th\u003E\n\u003Cth\u003ERust\u003C/th\u003E\n\u003Cth\u003ENotes\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eregister_draw(name, DrawWrapper)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eregister_draw\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EWraps one of the 9 stock draw-hook names (\u003Ccode\u003EDRAW_HOOK_NAMES\u003C/code\u003E). One wrapper per name. Returns 4 if drawing is disabled because the exe check failed.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Econtrol_rect(Control, float[4]) -\u0026gt; 0 ok\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Econtrol_rect(c) -\u0026gt; Option\u0026lt;[f32;4]\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EThe control\u0027s rectangle in UI units.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Emouse_pos(float[2])\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Emouse_pos()\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EThe mouse position in UI units.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edraw_item_icon(gbid, rect, depth)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Edraw_item_icon\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EAn item\u0027s inventory icon (by GBID), aspect-fitted into the rectangle.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edraw_texture(name, rect, argb, depth) -\u0026gt; 0 drawn / 1 missing\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Edraw_texture(...) -\u0026gt; bool\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EAny UI texture by name, for example \u003Ccode\u003EUI:Stash_Slot_Empty\u003C/code\u003E or \u003Ccode\u003EUI:Quality_Large_Inventory_Legendary\u003C/code\u003E, stretched over the rectangle and tinted by \u003Ccode\u003Eargb\u003C/code\u003E (\u003Ccode\u003E0xFFFFFFFF\u003C/code\u003E = unchanged).\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch2 id=\u0022client-api--version-4-item-tooltips\u0022\u003EVersion 4: item tooltips\u003C/h2\u003E\n\u003Cp\u003E\u003Ccode\u003Eint32_t show_item_tooltip(hover, generator, len, gbid, class, male, anchor)\u003C/code\u003E [\u003Ccode\u003Eshow_item_tooltip(hover, \u0026amp;[u8], gbid, class, male, Option\u0026lt;rect\u0026gt;) -\u0026gt; bool\u003C/code\u003E]\u003C/p\u003E\n\u003Cp\u003ECall it from a \u003Cstrong\u003Etooltip handler\u003C/strong\u003E: a layout style 105 handler, called every frame while its control is hovered; \u003Ccode\u003Ehover\u003C/code\u003E is that handler\u0027s \u003Ccode\u003Ercx\u003C/code\u003E. It shows the game\u0027s real item tooltip for a serialized \u003Ccode\u003ED3.Items.Generator\u003C/code\u003E protobuf (the item\u0027s saved form, which the server can produce).\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Eclass\u003C/code\u003E is the class index for the \u0026quot;equipped\u0026quot; comparison, or -1.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Emale\u003C/code\u003E picks the gender for gendered item names.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Eanchor\u003C/code\u003E is an optional rectangle to place the tooltip next to.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EThe Generator\u0027s \u003Ccode\u003Eflags\u003C/code\u003E field sets, among other things, ancient (\u003Ccode\u003E0x400\u003C/code\u003E) and primal (\u003Ccode\u003E0x4000\u003C/code\u003E).\u003C/p\u003E\n\u003Ch2 id=\u0022client-api--version-5-and-6-item-text\u0022\u003EVersion 5 and 6: item text\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Eitem_name(generator, len, class, male, buf, buf_len) -\u0026gt; len or -1\u003C/code\u003E [\u003Ccode\u003Eitem_name(\u0026amp;[u8], class, male)\u003C/code\u003E]: the localized display name, including rare names.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Eitem_line(generator, len, class, male, index, buf, buf_len)\u003C/code\u003E [\u003Ccode\u003Eitem_line(..., index)\u003C/code\u003E]: one string of the tooltip. 0 = name, 1 = type line (\u0026quot;Legendary Two-Handed Mace\u0026quot;), 3 = the big number (armor or DPS). Markup is stripped.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\u0022client-api--version-7-dropdowns\u0022\u003EVersion 7: dropdowns\u003C/h2\u003E\n\u003Cp\u003EDropdowns are layout control type 20 (UIComboBox). Every function returns 0, or non-zero if the control is not a dropdown.\u003C/p\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EEntry\u003C/th\u003E\n\u003Cth\u003ERust\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecombo_set_items(combo, texts[], data[], n)\u003C/code\u003E: replaces the entries; each has a \u003Ccode\u003Eu64\u003C/code\u003E of yours\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecombo_set_items(c, \u0026amp;[(\u0026amp;str, u64)])\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecombo_select(combo, index, fire)\u003C/code\u003E: -1 = none (the placeholder shows); \u003Ccode\u003Efire\u003C/code\u003E also runs the selection-changed handler (style 101)\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecombo_select\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecombo_selected(combo, \u0026amp;index, \u0026amp;data)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecombo_selected(c) -\u0026gt; Option\u0026lt;(i32, u64)\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecombo_set_placeholder(combo, text)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecombo_set_placeholder\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cp\u003EThe number of visible rows comes from layout property \u003Ccode\u003E0x87\u003C/code\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022client-api--helpers-rust-only\u0022\u003EHelpers (Rust only)\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Ereport_missing(path)\u003C/code\u003E logs, once per path, a control path that does not exist, together with the deepest prefix that does.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Ec_str(ptr)\u003C/code\u003E copies a C string.\u003C/li\u003E\n\u003C/ul\u003E\n","text":"Client API reference\nThe host passes plugins a HostApi table (C: D3HostApi, C#: D3HostApi). This page lists every entry, with the Rust wrapper from d3modapi in brackets. API version: 7.\nCompatibility. Entries are only ever appended to the end of the table, with the version raised by one. Nothing is removed or reordered. A plugin checks api-\u003Eversion \u003E= the version it was built for, so newer hosts run older plugins.\nEntry point\nint32_t d3mod_init(const D3HostApi *api, const char *mod_id, const char *mod_dir);\nThe host calls it once, on the game thread, before the game resolves any UI handler.\nmod_id is your id from mod.json.\nmod_dir is your installed folder: read your settings and files from there.\nReturn 0 on success. Any other value means \u0022not loaded\u0022, and the host logs the code.\nRust: call d3modapi::set_api(api, mod_id) first; it returns false if the host is too old.\nC#: call D3.Init(api, modId) first.\nThreading. Every API function must be called on the game thread: from d3mod_init, a UI handler, a wrapper or a draw hook. To do slow work (network, files), use your own thread, then apply the results from a handler that runs every frame, such as a wrapped ..._OnUpdate.\nTypes\nType Meaning Control An opaque pointer to a game UI control. null = not found. Every Rust wrapper is null-safe. Handler fn(rcx, rdx, r8, r9) -\u003E usize: a UI handler as the game calls it. For click handlers, rcx is the clicked control\u0027s handle (compare it with is_control). Wrapper fn(original, rcx, rdx, r8, r9) -\u003E usize: wraps a handler the game has. Call original to keep the game\u0027s behaviour. DrawFn / DrawWrapper fn(flag, depth) -\u003E usize / fn(original, flag, depth): draw hooks, see Drawing. rect [left, top, right, bottom] in UI units: the screen is 1600 \u00D7 1200 at any resolution; the host maps them to pixels. Version 1: handlers and controls\nlog\nvoid log(const char *line) [log(\u0026str)]\nWrites one line to \u003Cgame\u003E\\D3ModHost.log. The Rust and C# wrappers prefix your mod id.\nregister_handler\nint32_t register_handler(const char *name, Handler f) [register_handler(name, f) -\u003E bool]\nProvides a UI handler name that the exe does not have. Use it for handlers your own layouts name, or 2.0.1 names in ported layouts. Returns 0 on success, or 1 if another mod already registered the name; the first registration wins. If the exe does have the name, your handler is not used and the host logs a hint to use a wrapper.\nregister_wrapper\nint32_t register_wrapper(const char *name, Wrapper w) [register_wrapper(name, w) -\u003E bool]\nWraps a handler the exe does have. Your wrapper runs instead and receives the original. Several mods can wrap the same name: they chain in load order, and the first one registered is the innermost. There are 32 wrapper slots in total.\nfind_control\nControl find_control(const char *full_path) [find(path)]\nA control by its full path, for example Root.NormalLayer.BattleNetCampaign_main.LayoutRoot.Menu.PlayGameButton. Returns null when it does not exist, for example when the screen is not built yet.\nchild_of\nControl child_of(Control c, const char *relative) [child(c, \u0022.Child.Grandchild\u0022)]\nA descendant by relative path, starting with a dot. Works for list rows and template instances, where full paths are not registered.\nset_visible / set_text / get_text\nvoid set_visible(Control, int32_t) [show(c, bool)]\nvoid set_text(Control, const char *utf8) [set_text(c, \u0026str)]\nintptr_t get_text(Control, uint8_t *buf, size_t len) [get_text(c) -\u003E Option\u003CString\u003E]: returns the length, or -1.\nText can carry the game\u0027s markup, for example {icon:gold}, {c:ff99bbff}colored{/c} and \\n. set_text leaves dropdowns alone; use the combo functions for those.\npin_sno / create_layout\nvoid pin_sno(int32_t sno) [pin_sno]\nControl create_layout(int32_t sno) [create_layout(sno)]\nBuilds a UI layout SNO (yours from data/, or a stock one) into Root.NormalLayer, registered as Root.NormalLayer.\u003CLayoutName\u003E_main. A layout that another layout uses as a template must be pinned before the outer one is built.\nScreens are torn down when the player joins or leaves a game. Check with find(...) whether your root still exists, and rebuild it if not. Reset any cached row counts when you do.\nlist_add_item / list_get_item\nint32_t list_add_item(Control list) [list_add]: adds a row from the list box\u0027s template and returns its index.\nControl list_get_item(Control list, int32_t index) [list_get]\nWorks on list boxes (control type 13). Only address rows you created: list_get_item on a missing index returns garbage, which crashes when used. Keep your own row count.\nis_control\nint32_t is_control(uintptr_t handler_rcx, Control c) [is_control(rcx, c) -\u003E bool]\nWhether a click handler\u0027s rcx is this control. Use it to tell which list row\u0027s button was clicked.\nlogin_token\nintptr_t login_token(uint8_t *buf, size_t len) [login_token()]\nThe player\u0027s login token, used to authenticate your mod\u0027s REST calls to its server part. It contains the password: only send it in a POST body to your own server, and never log it.\ndump_controls\nvoid dump_controls(const char *needle) [dump_controls(\u0026str)]\nDiagnostics: logs up to 80 registered controls whose stored path contains needle, plus a total. See Finding controls.\nVersion 2: drawing\nThese work only inside a draw hook; see Drawing.\nEntry Rust Notes register_draw(name, DrawWrapper) register_draw Wraps one of the 9 stock draw-hook names (DRAW_HOOK_NAMES). One wrapper per name. Returns 4 if drawing is disabled because the exe check failed. control_rect(Control, float[4]) -\u003E 0 ok control_rect(c) -\u003E Option\u003C[f32;4]\u003E The control\u0027s rectangle in UI units. mouse_pos(float[2]) mouse_pos() The mouse position in UI units. draw_item_icon(gbid, rect, depth) draw_item_icon An item\u0027s inventory icon (by GBID), aspect-fitted into the rectangle. draw_texture(name, rect, argb, depth) -\u003E 0 drawn / 1 missing draw_texture(...) -\u003E bool Any UI texture by name, for example UI:Stash_Slot_Empty or UI:Quality_Large_Inventory_Legendary, stretched over the rectangle and tinted by argb (0xFFFFFFFF = unchanged). Version 4: item tooltips\nint32_t show_item_tooltip(hover, generator, len, gbid, class, male, anchor) [show_item_tooltip(hover, \u0026[u8], gbid, class, male, Option\u003Crect\u003E) -\u003E bool]\nCall it from a tooltip handler: a layout style 105 handler, called every frame while its control is hovered; hover is that handler\u0027s rcx. It shows the game\u0027s real item tooltip for a serialized D3.Items.Generator protobuf (the item\u0027s saved form, which the server can produce).\nclass is the class index for the \u0022equipped\u0022 comparison, or -1.\nmale picks the gender for gendered item names.\nanchor is an optional rectangle to place the tooltip next to.\nThe Generator\u0027s flags field sets, among other things, ancient (0x400) and primal (0x4000).\nVersion 5 and 6: item text\nitem_name(generator, len, class, male, buf, buf_len) -\u003E len or -1 [item_name(\u0026[u8], class, male)]: the localized display name, including rare names.\nitem_line(generator, len, class, male, index, buf, buf_len) [item_line(..., index)]: one string of the tooltip. 0 = name, 1 = type line (\u0022Legendary Two-Handed Mace\u0022), 3 = the big number (armor or DPS). Markup is stripped.\nVersion 7: dropdowns\nDropdowns are layout control type 20 (UIComboBox). Every function returns 0, or non-zero if the control is not a dropdown.\nEntry Rust combo_set_items(combo, texts[], data[], n): replaces the entries; each has a u64 of yours combo_set_items(c, \u0026[(\u0026str, u64)]) combo_select(combo, index, fire): -1 = none (the placeholder shows); fire also runs the selection-changed handler (style 101) combo_select combo_selected(combo, \u0026index, \u0026data) combo_selected(c) -\u003E Option\u003C(i32, u64)\u003E combo_set_placeholder(combo, text) combo_set_placeholder The number of visible rows comes from layout property 0x87.\nHelpers (Rust only)\nreport_missing(path) logs, once per path, a control path that does not exist, together with the deepest prefix that does.\nc_str(ptr) copies a C string.\n","sections":[{"id":"client-api--entry-point","title":"Entry point"},{"id":"client-api--types","title":"Types"},{"id":"client-api--version-1-handlers-and-controls","title":"Version 1: handlers and controls"},{"id":"client-api--version-2-drawing","title":"Version 2: drawing"},{"id":"client-api--version-4-item-tooltips","title":"Version 4: item tooltips"},{"id":"client-api--version-5-and-6-item-text","title":"Version 5 and 6: item text"},{"id":"client-api--version-7-dropdowns","title":"Version 7: dropdowns"},{"id":"client-api--helpers-rust-only","title":"Helpers (Rust only)"}]},{"id":"ui","title":"UI: layouts, handlers, drawing","html":"\u003Ch1 id=\u0022ui-layouts-handlers-drawing\u0022\u003EUI: layouts, handlers, drawing\u003C/h1\u003E\n\u003Cp\u003EThe game\u0027s UI is built from \u003Cstrong\u003Elayout files\u003C/strong\u003E (\u003Ccode\u003E.ui\u003C/code\u003E, SNO group UI). A layout is a tree of controls. Each control has a \u003Cstrong\u003Etype\u003C/strong\u003E, numeric \u003Cstrong\u003Eproperties\u003C/strong\u003E (position, size, flags) and \u003Cstrong\u003Estyles\u003C/strong\u003E (strings: handler names, texture names, text keys, template references). A mod can change stock layouts, add new ones (\u003Ccode\u003Edata/Base/UI/*.ui\u003C/code\u003E) and drive them from client code.\u003C/p\u003E\n\u003Ch2 id=\u0022ui--control-paths\u0022\u003EControl paths\u003C/h2\u003E\n\u003Cp\u003EA built layout lives under a layer: \u003Ccode\u003ERoot.NormalLayer.\u0026lt;LayoutName\u0026gt;_main.LayoutRoot....\u003C/code\u003E. For example:\u003C/p\u003E\n\u003Cpre\u003E\u003Ccode\u003ERoot.NormalLayer.BattleNetCampaign_main.LayoutRoot.Menu.PlayGameButton\nRoot.NormalLayer.BattleNetAuctionHouse_main.LayoutRoot.OverlayContainer.PageHeader...\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Efind(fullPath)\u003C/code\u003E gets a registered control.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Echild(control, \u0026quot;.A.B\u0026quot;)\u003C/code\u003E gets anything below it. Rows of list boxes and template instances are only reachable this way.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\u0022ui--finding-controls\u0022\u003EFinding controls\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003ED3ModTool ui-info \u0026lt;file.ui\u0026gt;\u003C/code\u003E lists a layout\u0027s controls, with types and how many styles and properties each has.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003ED3ModTool ui-info \u0026lt;file.ui\u0026gt; --full\u003C/code\u003E also prints every property and style.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Edump_controls(\u0026quot;text\u0026quot;)\u003C/code\u003E logs the registered controls of the running game whose path contains the text, for example \u003Ccode\u003Edump_controls(\u0026quot;BattleNetCampaign_main\u0026quot;)\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Ereport_missing(path)\u003C/code\u003E (Rust) logs the deepest part of a path that exists, which helps when a path is wrong.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EExtract stock layouts with \u003Ccode\u003ED3ModTool casc-extract UI \u0026lt;nameRegex\u0026gt; \u0026lt;outDir\u0026gt;\u003C/code\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022ui--values-one-id-space\u0022\u003EValues: one id space\u003C/h2\u003E\n\u003Cp\u003EEvery control value has an id from 0 to 0x11B (284 ids), each with a fixed kind, taken from the game\u0027s own table:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EStrings\u003C/strong\u003E go in the control\u0027s style array (\u003Ccode\u003Eui-style\u003C/code\u003E).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EInts, colours and bools\u003C/strong\u003E go in the int array (\u003Ccode\u003Eui-prop\u003C/code\u003E).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFloats\u003C/strong\u003E go in the float array.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003ESo \u0026quot;style 140\u0026quot; and \u0026quot;property 0x8C\u0026quot; are the same id. The UI designer shows every id with its name and meaning.\u003C/p\u003E\n\u003Cp\u003E\u003Cstrong\u003EWhere a value comes from\u003C/strong\u003E, first match wins:\u003C/p\u003E\n\u003Col\u003E\n\u003Cli\u003Ean override from the template instance that contains the control;\u003C/li\u003E\n\u003Cli\u003Ethe control\u0027s own value;\u003C/li\u003E\n\u003Cli\u003Eits named style (0x9D);\u003C/li\u003E\n\u003Cli\u003Eits template (0x9E);\u003C/li\u003E\n\u003Cli\u003Ethe game\u0027s default.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Ch2 id=\u0022ui--control-types\u0022\u003EControl types\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EType\u003C/th\u003E\n\u003Cth\u003EClass\u003C/th\u003E\n\u003Cth\u003EType\u003C/th\u003E\n\u003Cth\u003EClass\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E2\u003C/td\u003E\n\u003Ctd\u003Ewindow / panel\u003C/td\u003E\n\u003Ctd\u003E20\u003C/td\u003E\n\u003Ctd\u003Edropdown\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E3\u003C/td\u003E\n\u003Ctd\u003Ebutton\u003C/td\u003E\n\u003Ctd\u003E21\u003C/td\u003E\n\u003Ctd\u003E3D actor view\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E4\u003C/td\u003E\n\u003Ctd\u003Etext\u003C/td\u003E\n\u003Ctd\u003E22\u003C/td\u003E\n\u003Ctd\u003Eradio button\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E13\u003C/td\u003E\n\u003Ctd\u003Elist box\u003C/td\u003E\n\u003Ctd\u003E28\u003C/td\u003E\n\u003Ctd\u003Eblinker (animated sprite)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E14\u003C/td\u003E\n\u003Ctd\u003Elist item (template root)\u003C/td\u003E\n\u003Ctd\u003E30\u003C/td\u003E\n\u003Ctd\u003Eitem button\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E17\u003C/td\u003E\n\u003Ctd\u003Edraw-hook control\u003C/td\u003E\n\u003Ctd\u003E38\u003C/td\u003E\n\u003Ctd\u003Estack panel\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E18\u003C/td\u003E\n\u003Ctd\u003Echeck box\u003C/td\u003E\n\u003Ctd\u003E45\u003C/td\u003E\n\u003Ctd\u003Estoryboard (animation, not drawn)\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch2 id=\u0022ui--position-and-size\u0022\u003EPosition and size\u003C/h2\u003E\n\u003Cp\u003E\u003Cstrong\u003ESize and position\u003C/strong\u003E\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003E0x07\u003C/code\u003E, \u003Ccode\u003E0x08\u003C/code\u003E are x and y, relative to the parent. \u003Ccode\u003E0x09\u003C/code\u003E, \u003Ccode\u003E0x0A\u003C/code\u003E are width and height. All are in the 1600 \u00D7 1200 design space.\u003C/li\u003E\n\u003Cli\u003EIf \u003Ccode\u003E0x03\u003C/code\u003E or \u003Ccode\u003E0x04\u003C/code\u003E is set, the older absolute form applies instead: left \u003Ccode\u003E0x03\u003C/code\u003E, top \u003Ccode\u003E0x04\u003C/code\u003E, right \u003Ccode\u003E0x05\u003C/code\u003E, bottom \u003Ccode\u003E0x06\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003E0x0B\u003C/code\u003E/\u003Ccode\u003E0x0C\u003C/code\u003E cap the size (max width/height); \u003Ccode\u003E0x0D\u003C/code\u003E/\u003Ccode\u003E0x0E\u003C/code\u003E set a minimum.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003E0xD1\u003C/code\u003E aligns the control inside its parent: 1 centre horizontally, 2 centre vertically, 3 both, 4 right.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003E\u003Cstrong\u003EStack panels\u003C/strong\u003E (type 38) place their visible children one after another:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003Evertically, or horizontally if \u003Ccode\u003E0x99\u003C/code\u003E is set;\u003C/li\u003E\n\u003Cli\u003Ereversed if \u003Ccode\u003E0x9A\u003C/code\u003E is set;\u003C/li\u003E\n\u003Cli\u003Ewith spacing \u003Ccode\u003E0x9B\u003C/code\u003E and padding \u003Ccode\u003E0xA4\u003C/code\u003E (\u003Ccode\u003E\u0026quot;top,right,bottom,left\u0026quot;\u003C/code\u003E);\u003C/li\u003E\n\u003Cli\u003Ethen the stack takes the size of its content.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003E\u003Cstrong\u003EAnchors\u003C/strong\u003E decide where a control goes on screens wider or taller than 4:3:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003E0x8C\u003C/code\u003E (horizontal) is \u003Ccode\u003ELEFT\u003C/code\u003E, \u003Ccode\u003ERIGHT\u003C/code\u003E, \u003Ccode\u003ESTRETCH\u003C/code\u003E or centre.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003E0x8D\u003C/code\u003E (vertical) is \u003Ccode\u003ETOP\u003C/code\u003E, \u003Ccode\u003EBOTTOM\u003C/code\u003E or centre.\u003C/li\u003E\n\u003Cli\u003EA control without an anchor uses its nearest ancestor\u0027s.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003ELEFT\u003C/code\u003E and \u003Ccode\u003ERIGHT\u003C/code\u003E controls move to the real screen edges, so on 16:9 they shift by about 267 units into the side margins.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003ESTRETCH\u003C/code\u003E fills the whole screen.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\u0022ui--looks\u0022\u003ELooks\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EId\u003C/th\u003E\n\u003Cth\u003EMeaning\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x10\u003C/code\u003E\u2013\u003Ccode\u003E0x13\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Etexture: normal, hover, pressed, disabled (\u003Ccode\u003EUI:FrameName\u003C/code\u003E)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x14\u003C/code\u003E\u2013\u003Ccode\u003E0x17\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ebutton icon textures\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x1F\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eanimated sprite\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x20\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Esecond texture\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x0F\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ealpha, 0\u2013255\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x41\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Etext: a string key \u003Ccode\u003EList:Label\u003C/code\u003E, e.g. \u003Ccode\u003EBnet_Campaign:MenuPlayGame\u003C/code\u003E = \u0026quot;Start Game\u0026quot;\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x3A\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Efont (default \u003Ccode\u003EExocetLight\u003C/code\u003E)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x3B\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Efont size (default 24)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x33\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Etext colour, ARGB (default \u003Ccode\u003E0xFFCD9D51\u003C/code\u003E)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x3D\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ehorizontal text alignment: 1 left, 2 centre, 3 right\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x97\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Estarts hidden (show it from code)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x87\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Edropdown: visible rows\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0xAF\u003C/code\u003E\u2013\u003Ccode\u003E0xB3\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Esounds\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E0x6E\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Etooltip text\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cp\u003EA texture name \u003Ccode\u003EUI:Name\u003C/code\u003E is a \u003Cstrong\u003Eframe\u003C/strong\u003E, a named rectangle inside one of the game\u0027s \u003Ccode\u003E2DUI\u2026\u003C/code\u003E textures. Frame names are case sensitive. Use the designer\u0027s Art tab to browse them.\u003C/p\u003E\n\u003Ch2 id=\u0022ui--handlers-and-templates\u0022\u003EHandlers and templates\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EId\u003C/th\u003E\n\u003Cth\u003EMeaning\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E41\u003C/td\u003E\n\u003Ctd\u003Eclick handler name\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E44\u003C/td\u003E\n\u003Ctd\u003Edraw hook name (type-17 controls); must be one of the 9 stock names\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E99\u003C/td\u003E\n\u003Ctd\u003Eper-frame update handler\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E101\u003C/td\u003E\n\u003Ctd\u003Eselection changed (list boxes, dropdowns)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E105\u003C/td\u003E\n\u003Ctd\u003Etooltip handler (called every frame while hovered)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E157 (\u003Ccode\u003E0x9D\u003C/code\u003E)\u003C/td\u003E\n\u003Ctd\u003Enamed style, from this layout or \u003Ccode\u003ELayout:Style\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E158 (\u003Ccode\u003E0x9E\u003C/code\u003E)\u003C/td\u003E\n\u003Ctd\u003Etemplate: the control gets the target\u0027s children and falls back to its values\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E187 (\u003Ccode\u003E0xBB\u003C/code\u003E)\u003C/td\u003E\n\u003Ctd\u003Elist box row template\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E1 with value \u003Ccode\u003E\u0026quot;1\u0026quot;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Emarks a control as a template (not built by itself)\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cp\u003E\u003Cstrong\u003EAnimation:\u003C/strong\u003E type-45 storyboards hold tracks. Other controls bind those tracks to x, y, width, height, position, size or alpha.\u003C/p\u003E\n\u003Ch2 id=\u0022ui--handlers\u0022\u003EHandlers\u003C/h2\u003E\n\u003Cp\u003EA layout names a handler with a string style. When the screen is built, the game looks the name up:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ENames the exe has\u003C/strong\u003E run the game\u0027s code. Wrap them with \u003Ccode\u003Eregister_wrapper\u003C/code\u003E to run before or after it, or instead of it.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ENames the exe lacks\u003C/strong\u003E resolve through the host to a \u003Ccode\u003Eregister_handler\u003C/code\u003E function. That is how your own layout gets behaviour: invent a name such as \u003Ccode\u003EMyMod_OnClick_Buy\u003C/code\u003E, put it in style 41, and register it.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EClick handlers can be called for several mouse events of one click, so make them idempotent. For example, \u0026quot;open\u0026quot; should do nothing if the window is already open.\u003C/p\u003E\n\u003Ch2 id=\u0022ui--list-boxes\u0022\u003EList boxes\u003C/h2\u003E\n\u003Cp\u003EA list box (type 13) has a row template (style 187). From code:\u003C/p\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-rust\u0022\u003Elet i = api::list_add(list);                 // a new row, from the template\nlet row = api::list_get(list, i);\napi::set_text(api::child(row, \u0026quot;.ItemName\u0026quot;), \u0026quot;Ring of Royal Grandeur\u0026quot;);\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003ERows can\u0027t be removed. Keep your own count of rows created, reuse them, and hide the ones you don\u0027t need. \u003Ccode\u003ED3ModTool ui-make-listbox\u003C/code\u003E turns a static row of a layout into a list box with that row as its template.\u003C/p\u003E\n\u003Ch2 id=\u0022ui--drawing\u0022\u003EDrawing\u003C/h2\u003E\n\u003Cp\u003E2.8 resolves draw-hook names (style 44) only from a fixed table of 9 stock names:\u003C/p\u003E\n\u003Cpre\u003E\u003Ccode\u003EUIShop_Draw, UIInventory_Draw, UIInspect_Draw, UIEquipmentManager_DrawInventory, PlayerInspect_InventoryDraw,\nUITransmute_DrawGrid, UIHireling_Draw, UIGameBase_Draw, UIStash_Draw\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003ETo draw inside your layout:\u003C/p\u003E\n\u003Col\u003E\n\u003Cli\u003EGive your type-17 control the style 44 name of a stock window that is \u003Cstrong\u003Enot shown at the same time\u003C/strong\u003E as yours. At the main menu, for example, the follower window never draws, so \u003Ccode\u003EUIHireling_Draw\u003C/code\u003E is free there. Avoid \u003Ccode\u003EUIGameBase_Draw\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003EWrap that name with \u003Ccode\u003Eregister_draw\u003C/code\u003E. In the wrapper, draw only while your screen is shown; otherwise call \u003Ccode\u003Eoriginal\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003EDraw with \u003Ccode\u003Edraw_texture\u003C/code\u003E, \u003Ccode\u003Edraw_item_icon\u003C/code\u003E and \u003Ccode\u003Econtrol_rect\u003C/code\u003E, all in UI units.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cp\u003E\u003Cstrong\u003EDepth:\u003C/strong\u003E draw calls take the frame\u0027s \u003Ccode\u003Edepth\u003C/code\u003E counter. Each draw goes to \u003Ccode\u003Ez = 0.9999 - depth \u00D7 1e-4\u003C/code\u003E and increases the counter. To draw \u003Cem\u003Eover\u003C/em\u003E a later sibling, such as an icon over a dialog frame, advance the counter yourself before drawing.\u003C/p\u003E\n\u003Cp\u003EUseful stock textures:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003EUI:Stash_Slot_Empty\u003C/code\u003E, \u003Ccode\u003EUI:InventoryGrid_Slot\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003Ethe quality backgrounds \u003Ccode\u003EUI:Quality_{Large|Small}_{Inventory|Equip}_{Magic|Rare|Set|Legendary}\u003C/code\u003E, with an optional suffix \u003Ccode\u003E_Primal\u003C/code\u003E, \u003Ccode\u003E_Primalized\u003C/code\u003E, \u003Ccode\u003E_Sanctified\u003C/code\u003E or \u003Ccode\u003E_SeasonOnly\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EUI:Tab_Stash01_Selected\u003C/code\u003E \u2026 \u003Ccode\u003EUI:Tab_Stash53_Unselected\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EUI:SlotFlash_Generic\u003C/code\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\u0022ui--tooltips\u0022\u003ETooltips\u003C/h2\u003E\n\u003Cp\u003EGive the hovered control a style 105 handler. In it, call \u003Ccode\u003Eshow_item_tooltip(rcx, generator, ...)\u003C/code\u003E every frame while hovered. The tooltip is the game\u0027s own, with stats, sockets, set bonuses, ancient and primal frames, so your server part only has to send the item\u0027s \u003Ccode\u003ED3.Items.Generator\u003C/code\u003E bytes.\u003C/p\u003E\n\u003Ch2 id=\u0022ui--dropdowns\u0022\u003EDropdowns\u003C/h2\u003E\n\u003Cp\u003EA type 20 control. Fill it with \u003Ccode\u003Ecombo_set_items\u003C/code\u003E, read it with \u003Ccode\u003Ecombo_selected\u003C/code\u003E, and react to changes with a style 101 handler. Note that the style 101 handler\u0027s \u003Ccode\u003Ercx\u003C/code\u003E points at the combo\u0027s handle field, not at the combo itself.\u003C/p\u003E\n\u003Ch2 id=\u0022ui--screens-are-rebuilt\u0022\u003EScreens are rebuilt\u003C/h2\u003E\n\u003Cp\u003EJoining or leaving a game tears down the UI screens. A layout you built with \u003Ccode\u003Ecreate_layout\u003C/code\u003E is gone afterwards. Before showing it, check \u003Ccode\u003Efind(\u0026quot;Root.NormalLayer.\u0026lt;Name\u0026gt;_main\u0026quot;)\u003C/code\u003E. If it is null, build it again and reset everything that pointed into the old copy: list row counts, selections, dialogs.\u003C/p\u003E\n","text":"UI: layouts, handlers, drawing\nThe game\u0027s UI is built from layout files (.ui, SNO group UI). A layout is a tree of controls. Each control has a type, numeric properties (position, size, flags) and styles (strings: handler names, texture names, text keys, template references). A mod can change stock layouts, add new ones (data/Base/UI/*.ui) and drive them from client code.\nControl paths\nA built layout lives under a layer: Root.NormalLayer.\u003CLayoutName\u003E_main.LayoutRoot..... For example:\nRoot.NormalLayer.BattleNetCampaign_main.LayoutRoot.Menu.PlayGameButton\nRoot.NormalLayer.BattleNetAuctionHouse_
