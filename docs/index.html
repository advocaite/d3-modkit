main.LayoutRoot.OverlayContainer.PageHeader...\nfind(fullPath) gets a registered control.\nchild(control, \u0022.A.B\u0022) gets anything below it. Rows of list boxes and template instances are only reachable this way.\nFinding controls\nD3ModTool ui-info \u003Cfile.ui\u003E lists a layout\u0027s controls, with types and how many styles and properties each has.\nD3ModTool ui-info \u003Cfile.ui\u003E --full also prints every property and style.\ndump_controls(\u0022text\u0022) logs the registered controls of the running game whose path contains the text, for example dump_controls(\u0022BattleNetCampaign_main\u0022).\nreport_missing(path) (Rust) logs the deepest part of a path that exists, which helps when a path is wrong.\nExtract stock layouts with D3ModTool casc-extract UI \u003CnameRegex\u003E \u003CoutDir\u003E.\nValues: one id space\nEvery control value has an id from 0 to 0x11B (284 ids), each with a fixed kind, taken from the game\u0027s own table:\nStrings go in the control\u0027s style array (ui-style).\nInts, colours and bools go in the int array (ui-prop).\nFloats go in the float array.\nSo \u0022style 140\u0022 and \u0022property 0x8C\u0022 are the same id. The UI designer shows every id with its name and meaning.\nWhere a value comes from, first match wins:\nan override from the template instance that contains the control;\nthe control\u0027s own value;\nits named style (0x9D);\nits template (0x9E);\nthe game\u0027s default.\nControl types\nType Class Type Class 2 window / panel 20 dropdown 3 button 21 3D actor view 4 text 22 radio button 13 list box 28 blinker (animated sprite) 14 list item (template root) 30 item button 17 draw-hook control 38 stack panel 18 check box 45 storyboard (animation, not drawn) Position and size\nSize and position\n0x07, 0x08 are x and y, relative to the parent. 0x09, 0x0A are width and height. All are in the 1600 \u00D7 1200 design space.\nIf 0x03 or 0x04 is set, the older absolute form applies instead: left 0x03, top 0x04, right 0x05, bottom 0x06.\n0x0B/0x0C cap the size (max width/height); 0x0D/0x0E set a minimum.\n0xD1 aligns the control inside its parent: 1 centre horizontally, 2 centre vertically, 3 both, 4 right.\nStack panels (type 38) place their visible children one after another:\nvertically, or horizontally if 0x99 is set;\nreversed if 0x9A is set;\nwith spacing 0x9B and padding 0xA4 (\u0022top,right,bottom,left\u0022);\nthen the stack takes the size of its content.\nAnchors decide where a control goes on screens wider or taller than 4:3:\n0x8C (horizontal) is LEFT, RIGHT, STRETCH or centre.\n0x8D (vertical) is TOP, BOTTOM or centre.\nA control without an anchor uses its nearest ancestor\u0027s.\nLEFT and RIGHT controls move to the real screen edges, so on 16:9 they shift by about 267 units into the side margins.\nSTRETCH fills the whole screen.\nLooks\nId Meaning 0x10\u20130x13 texture: normal, hover, pressed, disabled (UI:FrameName) 0x14\u20130x17 button icon textures 0x1F animated sprite 0x20 second texture 0x0F alpha, 0\u2013255 0x41 text: a string key List:Label, e.g. Bnet_Campaign:MenuPlayGame = \u0022Start Game\u0022 0x3A font (default ExocetLight) 0x3B font size (default 24) 0x33 text colour, ARGB (default 0xFFCD9D51) 0x3D horizontal text alignment: 1 left, 2 centre, 3 right 0x97 starts hidden (show it from code) 0x87 dropdown: visible rows 0xAF\u20130xB3 sounds 0x6E tooltip text A texture name UI:Name is a frame, a named rectangle inside one of the game\u0027s 2DUI\u2026 textures. Frame names are case sensitive. Use the designer\u0027s Art tab to browse them.\nHandlers and templates\nId Meaning 41 click handler name 44 draw hook name (type-17 controls); must be one of the 9 stock names 99 per-frame update handler 101 selection changed (list boxes, dropdowns) 105 tooltip handler (called every frame while hovered) 157 (0x9D) named style, from this layout or Layout:Style 158 (0x9E) template: the control gets the target\u0027s children and falls back to its values 187 (0xBB) list box row template 1 with value \u00221\u0022 marks a control as a template (not built by itself) Animation: type-45 storyboards hold tracks. Other controls bind those tracks to x, y, width, height, position, size or alpha.\nHandlers\nA layout names a handler with a string style. When the screen is built, the game looks the name up:\nNames the exe has run the game\u0027s code. Wrap them with register_wrapper to run before or after it, or instead of it.\nNames the exe lacks resolve through the host to a register_handler function. That is how your own layout gets behaviour: invent a name such as MyMod_OnClick_Buy, put it in style 41, and register it.\nClick handlers can be called for several mouse events of one click, so make them idempotent. For example, \u0022open\u0022 should do nothing if the window is already open.\nList boxes\nA list box (type 13) has a row template (style 187). From code:\nlet i = api::list_add(list);                 // a new row, from the template\nlet row = api::list_get(list, i);\napi::set_text(api::child(row, .ItemName), Ring of Royal Grandeur);\nRows can\u0027t be removed. Keep your own count of rows created, reuse them, and hide the ones you don\u0027t need. D3ModTool ui-make-listbox turns a static row of a layout into a list box with that row as its template.\nDrawing\n2.8 resolves draw-hook names (style 44) only from a fixed table of 9 stock names:\nUIShop_Draw, UIInventory_Draw, UIInspect_Draw, UIEquipmentManager_DrawInventory, PlayerInspect_InventoryDraw,\nUITransmute_DrawGrid, UIHireling_Draw, UIGameBase_Draw, UIStash_Draw\nTo draw inside your layout:\nGive your type-17 control the style 44 name of a stock window that is not shown at the same time as yours. At the main menu, for example, the follower window never draws, so UIHireling_Draw is free there. Avoid UIGameBase_Draw.\nWrap that name with register_draw. In the wrapper, draw only while your screen is shown; otherwise call original.\nDraw with draw_texture, draw_item_icon and control_rect, all in UI units.\nDepth: draw calls take the frame\u0027s depth counter. Each draw goes to z = 0.9999 - depth \u00D7 1e-4 and increases the counter. To draw over a later sibling, such as an icon over a dialog frame, advance the counter yourself before drawing.\nUseful stock textures:\nUI:Stash_Slot_Empty, UI:InventoryGrid_Slot\nthe quality backgrounds UI:Quality_{Large|Small}_{Inventory|Equip}_{Magic|Rare|Set|Legendary}, with an optional suffix _Primal, _Primalized, _Sanctified or _SeasonOnly\nUI:Tab_Stash01_Selected \u2026 UI:Tab_Stash53_Unselected\nUI:SlotFlash_Generic\nTooltips\nGive the hovered control a style 105 handler. In it, call show_item_tooltip(rcx, generator, ...) every frame while hovered. The tooltip is the game\u0027s own, with stats, sockets, set bonuses, ancient and primal frames, so your server part only has to send the item\u0027s D3.Items.Generator bytes.\nDropdowns\nA type 20 control. Fill it with combo_set_items, read it with combo_selected, and react to changes with a style 101 handler. Note that the style 101 handler\u0027s rcx points at the combo\u0027s handle field, not at the combo itself.\nScreens are rebuilt\nJoining or leaving a game tears down the UI screens. A layout you built with create_layout is gone afterwards. Before showing it, check find(\u0022Root.NormalLayer.\u003CName\u003E_main\u0022). If it is null, build it again and reset everything that pointed into the old copy: list row counts, selections, dialogs.\n","sections":[{"id":"ui--control-paths","title":"Control paths"},{"id":"ui--finding-controls","title":"Finding controls"},{"id":"ui--values-one-id-space","title":"Values: one id space"},{"id":"ui--control-types","title":"Control types"},{"id":"ui--position-and-size","title":"Position and size"},{"id":"ui--looks","title":"Looks"},{"id":"ui--handlers-and-templates","title":"Handlers and templates"},{"id":"ui--handlers","title":"Handlers"},{"id":"ui--list-boxes","title":"List boxes"},{"id":"ui--drawing","title":"Drawing"},{"id":"ui--tooltips","title":"Tooltips"},{"id":"ui--dropdowns","title":"Dropdowns"},{"id":"ui--screens-are-rebuilt","title":"Screens are rebuilt"}]},{"id":"server-api","title":"Server API reference","html":"\u003Ch1 id=\u0022server-api-reference\u0022\u003EServer API reference\u003C/h1\u003E\n\u003Cp\u003EA server part is a .NET 8 class library that references the server\u0027s \u003Ccode\u003EBlizzless.dll\u003C/code\u003E with \u003Ccode\u003EPrivate=false\u003C/code\u003E, so the mod doesn\u0027t ship its own copy. At startup the server loads every \u003Ccode\u003EMods\\\u0026lt;id\u0026gt;\\server\\*.dll\u003C/code\u003E, or the \u003Ccode\u003Eserver.assembly\u003C/code\u003E from \u003Ccode\u003Emod.json\u003C/code\u003E, into its own process.\u003C/p\u003E\n\u003Cp\u003EThe server also lists mods that have \u003Cstrong\u003Egame data only\u003C/strong\u003E. Those are mods installed in the game copy it reads its data from, \u003Ccode\u003E\u0026lt;GameInstallPath\u0026gt;\\Mods\\\u0026lt;id\u0026gt;\u003C/code\u003E, where \u003Ccode\u003Emod-install --client\u003C/code\u003E puts them. Their new or replaced files are already built into that copy\u0027s storage, so the server reads them as normal game data, and nothing is loaded for them. The console shows, for example, \u003Ccode\u003EMod loaded: Custom prop test 0.1.0 (custom-prop-test) - game data only: 3 new, 0 replaced game file(s)\u003C/code\u003E. A mod with both a server part and game data is listed once, with the note \u003Ccode\u003Egame data active too\u003C/code\u003E.\u003C/p\u003E\n\u003Cp\u003EThe namespace is \u003Ccode\u003EDiIiS_NA.Mods\u003C/code\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022server-api--iservermod\u0022\u003EIServerMod\u003C/h2\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-csharp\u0022\u003Epublic sealed class MyMod : IServerMod\n{\n    public void Initialize(ServerModContext context) { ... }\n}\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003EThe server creates every public \u003Ccode\u003EIServerMod\u003C/code\u003E class with a parameterless constructor once, and calls \u003Ccode\u003EInitialize\u003C/code\u003E. This happens \u003Cstrong\u003Ebefore\u003C/strong\u003E the database schema is built and before any server listens. Only register things there: hooks, routes, settings. Don\u0027t touch the database or game state.\u003C/p\u003E\n\u003Ch2 id=\u0022server-api--servermodcontext\u0022\u003EServerModContext\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EMember\u003C/th\u003E\n\u003Cth\u003EMeaning\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EId\u003C/code\u003E, \u003Ccode\u003EName\u003C/code\u003E, \u003Ccode\u003EVersion\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Efrom \u003Ccode\u003Emod.json\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EDirectory\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe installed folder \u003Ccode\u003EMods\\\u0026lt;id\u0026gt;\u003C/code\u003E; read your settings from here\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003ELogger\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ea logger named after the mod: \u003Ccode\u003EInfo\u003C/code\u003E, \u003Ccode\u003EWarn\u003C/code\u003E, \u003Ccode\u003EError\u003C/code\u003E, \u003Ccode\u003EDebug\u003C/code\u003E. It writes to the server console and log files.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EHooks\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Egame events, see below\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003ERegisterRestRoute(prefix, handler)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EHTTP routes on the server\u0027s REST port\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch2 id=\u0022server-api--server-hooks\u0022\u003EServer hooks\u003C/h2\u003E\n\u003Cp\u003EHooks let a mod watch and change what the game does. Subscribe in \u003Ccode\u003EInitialize\u003C/code\u003E:\u003C/p\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-csharp\u0022\u003Econtext.Hooks.OnGoldDrop(e =\u0026gt; e.Amount *= 2);\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cul\u003E\n\u003Cli\u003EHandlers run in mod load order, on game threads, after the server\u0027s own rules. They see, and may change, the final values.\u003C/li\u003E\n\u003Cli\u003EAn exception in a handler is logged with the mod id, and the other handlers still run.\u003C/li\u003E\n\u003Cli\u003EKeep handlers short and never block.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EHook\u003C/th\u003E\n\u003Cth\u003EEvent object\u003C/th\u003E\n\u003Cth\u003EWhen\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EOnGoldDrop(Action\u0026lt;GoldDropEvent\u0026gt;)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003ESource\u003C/code\u003E (Actor), \u003Ccode\u003EPlayer\u003C/code\u003E, \u003Ccode\u003EAmount\u003C/code\u003E (get/set)\u003C/td\u003E\n\u003Ctd\u003EGold is about to drop for a player: a kill, a chest\u2026 The amount already includes the level table \u00D7 game gold modifier \u00D7 \u003Ccode\u003ERateMoney\u003C/code\u003E. An \u003Ccode\u003EAmount\u003C/code\u003E of 0 or less drops nothing.\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cp\u003EMore hooks are added as mods need them, always as new \u003Ccode\u003EOn...\u003C/code\u003E methods. Existing ones are not changed.\u003C/p\u003E\n\u003Ch2 id=\u0022server-api--commands\u0022\u003ECommands\u003C/h2\u003E\n\u003Cp\u003EAny class in a mod assembly that derives from \u003Ccode\u003ECommandGroup\u003C/code\u003E and has \u003Ccode\u003E[CommandGroup]\u003C/code\u003E becomes a chat and console command, exactly like the server\u0027s own:\u003C/p\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-csharp\u0022\u003E[CommandGroup(\u0026quot;goldrate\u0026quot;, \u0026quot;Shows or sets the gold multiplier.\u0026quot;, Account.UserLevels.User)]\npublic class GoldRateCommands : CommandGroup\n{\n    [DefaultCommand]\n    public string Show(string[] @params, BattleClient invokerClient) =\u0026gt; \u0026quot;...\u0026quot;;\n\n    [Command(\u0026quot;set\u0026quot;, \u0026quot;goldrate set \u0026lt;x\u0026gt;\u0026quot;, Account.UserLevels.GM)]\n    public string Set(string[] @params, BattleClient invokerClient) { ... }\n}\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cul\u003E\n\u003Cli\u003EIn game you type \u003Ccode\u003E!goldrate set 5\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EinvokerClient\u003C/code\u003E is null when the command comes from the server console.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EinGameOnly: true\u003C/code\u003E restricts a command to players in a game; there, \u003Ccode\u003EinvokerClient.InGameClient.Player\u003C/code\u003E is the player.\u003C/li\u003E\n\u003Cli\u003EUser levels are \u003Ccode\u003EUser\u003C/code\u003E, \u003Ccode\u003EGM\u003C/code\u003E and \u003Ccode\u003EAdmin\u003C/code\u003E. On release builds, a player whose level is too low gets \u0026quot;Unknown command\u0026quot;.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\u0022server-api--rest-routes\u0022\u003EREST routes\u003C/h2\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-csharp\u0022\u003Econtext.RegisterRestRoute(\u0026quot;/mymod/\u0026quot;, req =\u0026gt; ModRestReply.Json(\u0026quot;{\\\u0026quot;ok\\\u0026quot;:true}\u0026quot;));\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cul\u003E\n\u003Cli\u003ERequests whose path starts with the prefix go to your handler on the REST port (\u003Ccode\u003E[REST]\u003C/code\u003E in the server config).\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EModRestRequest\u003C/code\u003E has \u003Ccode\u003EMethod\u003C/code\u003E, \u003Ccode\u003EPath\u003C/code\u003E, \u003Ccode\u003ERoute\u003C/code\u003E, \u003Ccode\u003EQuery\u003C/code\u003E and \u003Ccode\u003EBody\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003EReply with \u003Ccode\u003EModRestReply.Json\u003C/code\u003E, \u003Ccode\u003E.Text\u003C/code\u003E, \u003Ccode\u003E.NotFound\u003C/code\u003E or \u003Ccode\u003Enew ModRestReply(status, body, contentType)\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003EHandlers run on the REST thread: answer quickly.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003ETo authenticate a player, the client part sends the login token (\u003Ccode\u003Elogin_token()\u003C/code\u003E) in a POST body. The server part resolves it to an account; the Auction House mod shows how.\u003C/p\u003E\n\u003Ch2 id=\u0022server-api--database-tables\u0022\u003EDatabase tables\u003C/h2\u003E\n\u003Cp\u003EFluentNHibernate \u003Ccode\u003EClassMap\u0026lt;T\u0026gt;\u003C/code\u003E classes in a mod assembly are picked up like the server\u0027s own. Their tables are created and updated automatically at startup. To read and write, use the server\u0027s \u003Ccode\u003EDBSessions\u003C/code\u003E helpers (\u003Ccode\u003ESessionQueryWhere\u003C/code\u003E, \u003Ccode\u003ESessionSave\u003C/code\u003E, \u003Ccode\u003ESessionUpdate\u003C/code\u003E...).\u003C/p\u003E\n\u003Cp\u003EFor a mod assembly that uses NHibernate, also reference \u003Ccode\u003ENHibernate.dll\u003C/code\u003E and \u003Ccode\u003EFluentNHibernate.dll\u003C/code\u003E from the server folder with \u003Ccode\u003EPrivate=false\u003C/code\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022server-api--game-code\u0022\u003EGame code\u003C/h2\u003E\n\u003Cp\u003EA server mod runs in the server process and can use anything public in \u003Ccode\u003EBlizzless.dll\u003C/code\u003E, for example \u003Ccode\u003EItemGenerator\u003C/code\u003E, \u003Ccode\u003EPlayer.Inventory\u003C/code\u003E and \u003Ccode\u003EGameAttributes\u003C/code\u003E.\u003C/p\u003E\n\u003Cp\u003EHooks are the stable surface; direct use of the server\u0027s classes can break when the server changes. If you need an event that has no hook yet, ask for one rather than patching the server.\u003C/p\u003E\n","text":"Server API reference\nA server part is a .NET 8 class library that references the server\u0027s Blizzless.dll with Private=false, so the mod doesn\u0027t ship its own copy. At startup the server loads every Mods\\\u003Cid\u003E\\server\\*.dll, or the server.assembly from mod.json, into its own process.\nThe server also lists mods that have game data only. Those are mods installed in the game copy it reads its data from, \u003CGameInstallPath\u003E\\Mods\\\u003Cid\u003E, where mod-install --client puts them. Their new or replaced files are already built into that copy\u0027s storage, so the server reads them as normal game data, and nothing is loaded for them. The console shows, for example, Mod loaded: Custom prop test 0.1.0 (custom-prop-test) - game data only: 3 new, 0 replaced game file(s). A mod with both a server part and game data is listed once, with the note game data active too.\nThe namespace is DiIiS_NA.Mods.\nIServerMod\npublic sealed class MyMod : IServerMod\n{\n    public void Initialize(ServerModContext context) { ... }\n}\nThe server creates every public IServerMod class with a parameterless constructor once, and calls Initialize. This happens before the database schema is built and before any server listens. Only register things there: hooks, routes, settings. Don\u0027t touch the database or game state.\nServerModContext\nMember Meaning Id, Name, Version from mod.json Directory the installed folder Mods\\\u003Cid\u003E; read your settings from here Logger a logger named after the mod: Info, Warn, Error, Debug. It writes to the server console and log files. Hooks game events, see below RegisterRestRoute(prefix, handler) HTTP routes on the server\u0027s REST port Server hooks\nHooks let a mod watch and change what the game does. Subscribe in Initialize:\ncontext.Hooks.OnGoldDrop(e = e.Amount *= 2);\nHandlers run in mod load order, on game threads, after the server\u0027s own rules. They see, and may change, the final values.\nAn exception in a handler is logged with the mod id, and the other handlers still run.\nKeep handlers short and never block.\nHook Event object When OnGoldDrop(Action\u003CGoldDropEvent\u003E) Source (Actor), Player, Amount (get/set) Gold is about to drop for a player: a kill, a chest\u2026 The amount already includes the level table \u00D7 game gold modifier \u00D7 RateMoney. An Amount of 0 or less drops nothing. More hooks are added as mods need them, always as new On... methods. Existing ones are not changed.\nCommands\nAny class in a mod assembly that derives from CommandGroup and has [CommandGroup] becomes a chat and console command, exactly like the server\u0027s own:\n[CommandGroup(goldrate, Shows or sets the gold multiplier., Account.UserLevels.User)]\npublic class GoldRateCommands : CommandGroup\n{\n    [DefaultCommand]\n    public string Show(string[] @params, BattleClient invokerClient) = ...;\n\n    [Command(set, goldrate set x, Account.UserLevels.GM)]\n    public string Set(string[] @params, BattleClient invokerClient) { ... }\n}\nIn game you type !goldrate set 5.\ninvokerClient is null when the command comes from the server console.\ninGameOnly: true restricts a command to players in a game; there, invokerClient.InGameClient.Player is the player.\nUser levels are User, GM and Admin. On release builds, a player whose level is too low gets \u0022Unknown command\u0022.\nREST routes\ncontext.RegisterRestRoute(/mymod/, req = ModRestReply.Json({\\ok\\:true}));\nRequests whose path starts with the prefix go to your handler on the REST port ([REST] in the server config).\nModRestRequest has Method, Path, Route, Query and Body.\nReply with ModRestReply.Json, .Text, .NotFound or new ModRestReply(status, body, contentType).\nHandlers run on the REST thread: answer quickly.\nTo authenticate a player, the client part sends the login token (login_token()) in a POST body. The server part resolves it to an account; the Auction House mod shows how.\nDatabase tables\nFluentNHibernate ClassMap\u003CT\u003E classes in a mod assembly are picked up like the server\u0027s own. Their tables are created and updated automatically at startup. To read and write, use the server\u0027s DBSessions helpers (SessionQueryWhere, SessionSave, SessionUpdate...).\nFor a mod assembly that uses NHibernate, also reference NHibernate.dll and FluentNHibernate.dll from the server folder with Private=false.\nGame code\nA server mod runs in the server process and can use anything public in Blizzless.dll, for example ItemGenerator, Player.Inventory and GameAttributes.\nHooks are the stable surface; direct use of the server\u0027s classes can break when the server changes. If you need an event that has no hook yet, ask for one rather than patching the server.\n","sections":[{"id":"server-api--iservermod","title":"IServerMod"},{"id":"server-api--servermodcontext","title":"ServerModContext"},{"id":"server-api--server-hooks","title":"Server hooks"},{"id":"server-api--commands","title":"Commands"},{"id":"server-api--rest-routes","title":"REST routes"},{"id":"server-api--database-tables","title":"Database tables"},{"id":"server-api--game-code","title":"Game code"}]},{"id":"game-data","title":"Game data","html":"\u003Ch1 id=\u0022game-data\u0022\u003EGame data\u003C/h1\u003E\n\u003Cp\u003EA mod\u0027s \u003Ccode\u003Edata/\u003C/code\u003E folder holds game files: UI layouts, string lists, textures and other SNO files. They are built into the game copy\u0027s storage (CASC), next to the stock files.\u003C/p\u003E\n\u003Ch2 id=\u0022game-data--layout\u0022\u003ELayout\u003C/h2\u003E\n\u003Cpre\u003E\u003Ccode\u003Edata\\\u0026lt;RootDir\u0026gt;\\\u0026lt;Group\u0026gt;\\\u0026lt;Name\u0026gt;\u0026lt;ext\u0026gt;\ndata\\Base\\UI\\MyWindow.ui                 a UI layout\ndata\\enUS\\StringList\\MyStrings.stl       English strings\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003E\u0026lt;RootDir\u0026gt;\u003C/code\u003E is the storage\u0027s root directory: \u003Ccode\u003EBase\u003C/code\u003E for most files, and the locale (\u003Ccode\u003EenUS\u003C/code\u003E, \u2026) for localized ones.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003E\u0026lt;Group\u0026gt;\u003C/code\u003E is the SNO group folder: \u003Ccode\u003EUI\u003C/code\u003E, \u003Ccode\u003EStringList\u003C/code\u003E, \u003Ccode\u003ETextures\u003C/code\u003E, \u2026.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003E\u0026lt;Name\u0026gt;\u003C/code\u003E becomes the SNO name.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\u0022game-data--add-or-replace\u0022\u003EAdd or replace\u003C/h2\u003E\n\u003Cp\u003EEvery SNO file carries its id in its header (at offset 16):\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EAn id that already exists\u003C/strong\u003E in the game\u0027s table of contents \u003Cstrong\u003Ereplaces\u003C/strong\u003E that SNO. Example: a changed \u003Ccode\u003EBattleNetCampaign.ui\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EAny other id adds a new SNO.\u003C/strong\u003E Its group comes from the folder and its name from the file name.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EPick ids for new SNOs that the game does not use. The Auction House mod reuses the 2.0.1 ids of its layouts, which 2.8 no longer has.\u003C/p\u003E\n\u003Cp\u003E\u003Ccode\u003Emod.json\u003C/code\u003E\u0027s \u003Ccode\u003Eadds\u003C/code\u003E and \u003Ccode\u003Ereplaces\u003C/code\u003E lists are notes for readers only; the build decides from the file itself.\u003C/p\u003E\n\u003Ch2 id=\u0022game-data--building\u0022\u003EBuilding\u003C/h2\u003E\n\u003Cp\u003E\u003Ccode\u003ED3ModTool mod-install ... --client \u0026lt;game\u0026gt;\u003C/code\u003E copies \u003Ccode\u003Edata\\\u003C/code\u003E into \u003Ccode\u003E\u0026lt;game\u0026gt;\\Mods\\\u0026lt;id\u0026gt;\\data\u003C/code\u003E, then rebuilds the storage from every installed and enabled mod. Mods are ordered by id, with \u003Ccode\u003Erequires\u003C/code\u003E first, so a later mod\u0027s file wins.\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003ED3ModTool mod-data --client \u0026lt;game\u0026gt;\u003C/code\u003E rebuilds without installing anything.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Emod-verify\u003C/code\u003E reads every mod file back through two independent readers, and compares 64 random stock files with the official install.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Emod-restore\u003C/code\u003E returns the copy to stock.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EThe build writes one archive of its own (\u003Ccode\u003Edata.NNN\u003C/code\u003E) plus new index and config files. It never changes stock archives, so a rebuild or a restore is always clean.\u003C/p\u003E\n\u003Cp\u003EThe writer refuses to touch the official install.\u003C/p\u003E\n\u003Ch2 id=\u0022game-data--ui-layout-tools\u0022\u003EUI layout tools\u003C/h2\u003E\n\u003Cp\u003EAll of these edit \u003Ccode\u003E.ui\u003C/code\u003E files in place unless an output file is given:\u003C/p\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ECommand\u003C/th\u003E\n\u003Cth\u003EDoes\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-info \u0026lt;file\u0026gt; [--full]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Etree of controls (types, counts); \u003Ccode\u003E--full\u003C/code\u003E adds every property and style\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-check \u0026lt;file\\|dir\u0026gt; [version\\|any]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eparses and validates layouts\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-convert \u0026lt;in201Dir\\|file\u0026gt; \u0026lt;outDir\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Econverts 2.0.1 layouts (format 463) to 2.8 (471)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-prop \u0026lt;file\u0026gt; \u0026lt;control\u0026gt; \u0026lt;id\u0026gt; \u0026lt;value\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Esets or adds an int property, e.g. \u003Ccode\u003E0x07\u003C/code\u003E x\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-style \u0026lt;file\u0026gt; \u0026lt;control\u0026gt; \u0026lt;id\u0026gt; \u0026lt;string\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Esets or adds a style, e.g. \u003Ccode\u003E41\u003C/code\u003E click handler\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-style-remove \u0026lt;file\u0026gt; \u0026lt;control\u0026gt; \u0026lt;id\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eremoves a style\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-type \u0026lt;file\u0026gt; \u0026lt;control\u0026gt; \u0026lt;type\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Echanges a control\u0027s type\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-move \u0026lt;file\u0026gt; \u0026lt;from\u0026gt; \u0026lt;to\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Emoves or renames a control (subtree)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-clone \u0026lt;file\u0026gt; \u0026lt;control\u0026gt; \u0026lt;copies\u0026gt; [out]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ecopies a control; the copies are \u003Ccode\u003E\u0026lt;name\u0026gt;1\u003C/code\u003E, \u003Ccode\u003E\u0026lt;name\u0026gt;2\u003C/code\u003E, \u2026, each with its own properties\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-copy-subtree \u0026lt;dst\u0026gt; \u0026lt;src\u0026gt; \u0026lt;src root\u0026gt; \u0026lt;new root\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ecopies a subtree from another layout\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-inline \u0026lt;main\u0026gt; \u0026lt;ref control\u0026gt; \u0026lt;template.ui\u0026gt; \u0026lt;template root\u0026gt; [out]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Einlines a template layout\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-make-listbox \u0026lt;file\u0026gt; \u0026lt;container\u0026gt; \u0026lt;row\u0026gt; \u0026lt;templateName\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Eturns a static row into a list box with a row template\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cp\u003EControl paths in these commands are full layout paths such as \u003Ccode\u003EMyWindow_main.LayoutRoot.Panel.OkButton\u003C/code\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022game-data--ui-designer\u0022\u003EUI designer\u003C/h2\u003E\n\u003Cp\u003E\u003Ccode\u003ED3ModTool ui-designer [projectDir] [--port 5190] [--install DIR]\u003C/code\u003E opens the visual designer in your browser. It runs on \u003Ccode\u003Ehttp://127.0.0.1:5190\u003C/code\u003E, is only reachable from this PC, and is laid out like a forms designer:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ELeft\u003C/strong\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EToolbox:\u003C/strong\u003E panel, image, button, text, check box, radio button, dropdown, list box and stack panel. Drag one onto the surface (it goes into the panel under the mouse), or click it to add it to the selected panel.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ELayouts:\u003C/strong\u003E the game\u0027s layouts, which open read only (use \u003Cstrong\u003ESave as\u2026\u003C/strong\u003E into your mod to replace one), and the \u003Ccode\u003E.ui\u003C/code\u003E files of your project.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EArt:\u003C/strong\u003E every UI, item and minimap texture, plus the textures in your project. Click a frame to copy its name; \u003Cstrong\u003EExtract to project\u003C/strong\u003E writes PNGs into \u003Ccode\u003E\u0026lt;project\u0026gt;\\Art\\\u0026lt;Texture\u0026gt;\\\u003C/code\u003E.\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EImport PNG\u2026\u003C/strong\u003E turns a picture (PNG, JPEG or WebP, up to 4096\u00D74096) into a new UI texture of a mod: \u003Ccode\u003E\u0026lt;project\u0026gt;\\\u0026lt;mod\u0026gt;\\data\\Base\\Textures\\2DUI_\u0026lt;name\u0026gt;.tex\u003C/code\u003E, with one frame \u003Ccode\u003EUI:\u0026lt;frame\u0026gt;\u003C/code\u003E covering the picture. A new mod folder gets a \u003Ccode\u003Emod.json\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003EFrame names must be unique among all UI frames, because the game registers them by name, so a clash with the game or another project texture is refused.\u003C/li\u003E\n\u003Cli\u003EThe texture is stored uncompressed, which is large: 1600\u00D71200 is 7.7 MB.\u003C/li\u003E\n\u003Cli\u003EWhen you started from a property\u0027s \u003Cstrong\u003E\u2026\u003C/strong\u003E button, the new frame is assigned to it straight away. Project textures show on the canvas immediately; in the game they appear after \u003Ccode\u003Emod-install\u003C/code\u003E / \u003Ccode\u003Ebuild_mods\u003C/code\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ECentre: the design surface.\u003C/strong\u003E It draws the layout as the game places it, with real textures and text, on the chosen screen shape (the dashed box is the 4:3 design area).\n\u003Cul\u003E\n\u003Cli\u003EClick to select (Alt\u002Bclick picks the control below; Ctrl\u002Bclick or a drag on empty space selects several).\u003C/li\u003E\n\u003Cli\u003EDrag to move, and drag one of the 8 handles to resize. Arrow keys nudge by 1, or by 10 with Shift.\u003C/li\u003E\n\u003Cli\u003EWheel zooms; middle mouse or Space\u002Bdrag pans; \u003Ccode\u003E0\u003C/code\u003E fits the view.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EPreview\u003C/strong\u003E draws the screen like the game: no outlines, and controls the layout hides stay hidden. The window itself is always shown.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ERight\u003C/strong\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EOutline:\u003C/strong\u003E the control tree. The eye on each row hides a control in the designer only, so you can work on what\u0027s below it (Alt\u002Bclick shows only that one among its siblings, e.g. one act of the loading screen); the file doesn\u0027t change. It collapses, drag a control onto another to move it inside, and it has \u003Cstrong\u003EGroup\u003C/strong\u003E (Ctrl\u002BG: the selected controls go into a new panel and keep their place on screen), \u003Cstrong\u003EDup\u003C/strong\u003E (Ctrl\u002BD) and \u003Cstrong\u003EDel\u003C/strong\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EProperties:\u003C/strong\u003E a grid in categories (Layout, Appearance, Text, Behavior, Template \u0026amp; style, Stack panel, Other values), with editors for each kind: anchors and alignment as lists, colours, check boxes, and a texture picker (\u003Cstrong\u003E\u2026\u003C/strong\u003E) that opens the Art browser.\n\u003Cul\u003E\n\u003Cli\u003EInherited values are grey; editing one makes it the control\u0027s own, and \u00D7 removes the own value again.\u003C/li\u003E\n\u003Cli\u003EText keys show the text the player reads.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ENew\u2026\u003C/strong\u003E creates an empty layout (\u003Ccode\u003E\u0026lt;Name\u0026gt;_main.LayoutRoot\u003C/code\u003E) with a SNO id you choose, for a screen of your own.\u003C/li\u003E\n\u003Cli\u003EUndo / redo: Ctrl\u002BZ, Ctrl\u002BY. Save: Ctrl\u002BS.\u003C/li\u003E\n\u003Cli\u003EDeep links: \u003Ccode\u003E\u2026/#stock/Vendor\u003C/code\u003E or \u003Ccode\u003E\u2026/#custom/MyMod/data/Base/UI/X.ui\u003C/code\u003E, with an optional \u003Ccode\u003E!\u0026lt;control path\u0026gt;\u003C/code\u003E to select a control.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003ESaving writes the whole layout through the byte-exact writer: data the designer does not understand is kept as it was. Every save is validated first. New, grouped and moved controls are written in the same order as stock layouts (a parent before its children).\u003C/p\u003E\n\u003Cblockquote\u003E\n\u003Cp\u003ENot modelled: positions the game sets in code at runtime (some buttons are moved by handlers) and list rows, which are created at runtime. Controls inside a stack panel are placed by the panel.\u003C/p\u003E\n\u003C/blockquote\u003E\n\u003Ch2 id=\u0022game-data--round-trip\u0022\u003ERound trip\u003C/h2\u003E\n\u003Cp\u003E\u003Ccode\u003ED3ModTool ui-roundtrip \u0026lt;dir\u0026gt;\u003C/code\u003E reads and rewrites every \u003Ccode\u003E.ui\u003C/code\u003E under a folder and checks the bytes are identical. All 258 stock 2.8 layouts pass.\u003C/p\u003E\n\u003Ch2 id=\u0022game-data--art-and-other-assets\u0022\u003EArt and other assets\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EUI art:\u003C/strong\u003E the designer\u0027s \u003Cstrong\u003EImport PNG\u2026\u003C/strong\u003E (above) makes a new \u003Ccode\u003E2DUI_\u003C/code\u003E texture.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EStatic props (3D models):\u003C/strong\u003E \u003Ccode\u003Eimport-gltf\u003C/code\u003E (below) turns a glTF model into a new actor.\u003C/li\u003E\n\u003Cli\u003EA mod can also draw any \u003Cstrong\u003Estock\u003C/strong\u003E texture by name with \u003Ccode\u003Edraw_texture\u003C/code\u003E, and replace stock files with edited copies.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\u0022game-data--models-import-gltf\u0022\u003EModels: \u003Ccode\u003Eimport-gltf\u003C/code\u003E\u003C/h2\u003E\n\u003Cpre\u003E\u003Ccode\u003ED3ModTool import-gltf \u0026lt;model.glb|.gltf\u0026gt; \u0026lt;modDir\u0026gt; --name \u0026lt;Name\u0026gt; [--like \u0026lt;actor\u0026gt;] [--sno \u0026lt;first id\u0026gt;] [--scale \u0026lt;s\u0026gt;] [--actor-scale \u0026lt;s\u0026gt;] [--install DIR]\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003EIt turns a glTF 2.0 model into a \u003Cstrong\u003Estatic prop\u003C/strong\u003E and writes three kinds of SNO files into the mod\u0027s \u003Ccode\u003Edata\\Base\\\u003C/code\u003E folder:\u003C/p\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EFile\u003C/th\u003E\n\u003Cth\u003EWhat\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003ETextures\\\u0026lt;Name\u0026gt;_diff.tex\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EOne texture per material. It is DXT1, or DXT5 when the image has transparency, with a full mip chain down to a 4-pixel side.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EAppearance\\\u0026lt;Name\u0026gt;.app\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EThe mesh, with one sub-object per glTF primitive and one material per glTF material. The texture goes in the diffuse slot.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EActor\\\u0026lt;Name\u0026gt;.acr\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EAn actor that uses the appearance. Spawn this one in the game.\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cp\u003EThe new ids are added to \u003Ccode\u003Emod.json\u003C/code\u003E \u003Ccode\u003E\u0026quot;adds\u0026quot;\u003C/code\u003E.\u003C/p\u003E\n\u003Cp\u003E\u003Cstrong\u003ETemplate.\u003C/strong\u003E Every field the tool does not understand is copied from a stock prop, so the new files differ from a known-good file only where they have to.\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003E--like\u003C/code\u003E names the template actor, by SNO id or name. The default is \u003Ccode\u003E61743\u003C/code\u003E (\u003Ccode\u003Ea2dun_Aqd_Act_Post_B_02_Base\u003C/code\u003E): a non-interactive \u003Cstrong\u003EServerProp\u003C/strong\u003E with one mesh, no bones and one diffuse texture.\u003C/li\u003E\n\u003Cli\u003EThe template must be a type the server can spawn, such as ServerProp. \u003Cstrong\u003EEnvironment props don\u0027t work:\u003C/strong\u003E the client places those itself from the scene data and ignores the server\u0027s copy, so they never appear. That\u0027s why \u003Ccode\u003E433\u003C/code\u003E (\u003Ccode\u003ESkeleton_1H_bonePile\u003C/code\u003E) can\u0027t be used. Confirmed in game on 2026-11-13: an obelisk built on \u003Ccode\u003E61743\u003C/code\u003E shows up both with \u003Ccode\u003E!spawn\u003C/code\u003E and when placed with the world editor.\u003C/li\u003E\n\u003Cli\u003EThe template must be that simple: one look, one material, one unskinned mesh, no bones, no collision or physics data. The tool refuses any other template.\u003C/li\u003E\n\u003Cli\u003ETemplates are read from the official install, which is only ever read.\u003C/li\u003E\n\u003Cli\u003EThe actor keeps the template\u0027s type, tags and collision settings. Its bounds are recomputed. Its PhysMesh is cleared. The \u003Ccode\u003EScale\u003C/code\u003E tag is set to \u003Ccode\u003E--actor-scale\u003C/code\u003E (default 1).\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003E\u003Cstrong\u003EInput rules.\u003C/strong\u003E\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003EglTF space: Y up, metres, counter-clockwise front faces, as Blender\u0027s exporter writes it.\u003C/li\u003E\n\u003Cli\u003EThe game is Z up, in feet. \u003Ccode\u003E--scale\u003C/code\u003E defaults to 3.28084 (metres to feet). Use \u003Ccode\u003E--scale 1\u003C/code\u003E for a model made in feet.\u003C/li\u003E\n\u003Cli\u003ENode transforms are applied. Skins, animations, morph targets and texture transforms are ignored, with a warning.\u003C/li\u003E\n\u003Cli\u003EEach primitive needs \u003Ccode\u003EPOSITION\u003C/code\u003E. \u003Ccode\u003ENORMAL\u003C/code\u003E is optional (smooth normals are computed when it is missing), and so is \u003Ccode\u003ETEXCOORD_0\u003C/code\u003E. A sub-object holds at most 65,535 vertices.\u003C/li\u003E\n\u003Cli\u003EThe base color texture must be a PNG, either embedded or a file next to a \u003Ccode\u003E.gltf\u003C/code\u003E. Other sizes are resized to powers of two, up to 2048. \u003Ccode\u003EbaseColorFactor\u003C/code\u003E is multiplied in. A material without a texture becomes a flat colour.\u003C/li\u003E\n\u003Cli\u003EOnly the base colour is used. Normal, emissive and metallic/roughness maps are ignored.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003E\u003Cstrong\u003EIds.\u003C/strong\u003E A re-import keeps the ids the mod\u0027s files already have. Otherwise the tool takes the first ids from \u003Ccode\u003E--sno\u003C/code\u003E (default 600000) that are free in the game and in every mod folder next to this one. The names must not already exist in the game.\u003C/p\u003E\n\u003Cp\u003E\u003Cstrong\u003EGetting it into the game:\u003C/strong\u003E\u003C/p\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Ccode\u003Emod-install \u0026lt;modDir\u0026gt; --client \u0026lt;game copy\u0026gt;\u003C/code\u003E builds it into the game copy.\u003C/li\u003E\n\u003Cli\u003EPoint the server\u0027s \u003Ccode\u003E[Storage] GameInstallPath\u003C/code\u003E at the same game copy, so it knows the new actor.\u003C/li\u003E\n\u003Cli\u003ESpawn the actor, e.g. GM command \u003Ccode\u003E!spawn \u0026lt;actor id\u0026gt;\u003C/code\u003E, or place it with the DevHub world editor.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cp\u003EThe new actor is not interactive and has no collision mesh.\u003C/p\u003E\n","text":"Game data\nA mod\u0027s data/ folder holds game files: UI layouts, string lists, textures and other SNO files. They are built into the game copy\u0027s storage (CASC), next to the stock files.\nLayout\ndata\\RootDir\\Group\\Nameext\ndata\\Base\\UI\\MyWindow.ui                 a UI layout\ndata\\enUS\\StringList\\MyStrings.stl       English strings\n\u003CRootDir\u003E is the storage\u0027s root directory: Base for most files, and the locale (enUS, \u2026) for localized ones.\n\u003CGroup\u003E is the SNO group folder: UI, StringList, Textures, \u2026.\n\u003CName\u003E becomes the SNO name.\nAdd or replace\nEvery SNO file carries its id in its header (at offset 16):\nAn id that already exists in the game\u0027s table of contents replaces that SNO. Example: a changed BattleNetCampaign.ui.\nAny other id adds a new SNO. Its group comes from the folder and its name from the file name.\nPick ids for new SNOs that the game does not use. The Auction House mod reuses the 2.0.1 ids of its layouts, which 2.8 no longer has.\nmod.json\u0027s adds and replaces lists are notes for readers only; the build decides from the file itself.\nBuilding\nD3ModTool mod-install ... --client \u003Cgame\u003E copies data\\ into \u003Cgame\u003E\\Mods\\\u003Cid\u003E\\data, then rebuilds the storage from every installed and enabled mod. Mods are ordered by id, with requires first, so a later mod\u0027s file wins.\nD3ModTool mod-data --client \u003Cgame\u003E rebuilds without installing anything.\nmod-verify reads every mod file back through two independent readers, and compares 64 random stock files with the official install.\nmod-restore returns the copy to stock.\nThe build writes one archive of its own (data.NNN) plus new index and config files. It never changes stock archives, so a rebuild or a restore is always clean.\nThe writer refuses to touch the official install.\nUI layout tools\nAll of these edit .ui files in place unless an output file is given:\nCommand Does ui-info \u003Cfile\u003E [--full] tree of controls (types, counts); --full adds every property and style ui-check \u003Cfile\\|dir\u003E [version\\|any] parses and validates layouts ui-convert \u003Cin201Dir\\|file\u003E \u003CoutDir\u003E converts 2.0.1 layouts (format 463) to 2.8 (471) ui-prop \u003Cfile\u003E \u003Ccontrol\u003E \u003Cid\u003E \u003Cvalue\u003E sets or adds an int property, e.g. 0x07 x ui-style \u003Cfile\u003E \u003Ccontrol\u003E \u003Cid\u003E \u003Cstring\u003E sets or adds a style, e.g. 41 click handler ui-style-remove \u003Cfile\u003E \u003Ccontrol\u003E \u003Cid\u003E removes a style ui-type \u003Cfile\u003E \u003Ccontrol\u003E \u003Ctype\u003E changes a control\u0027s type ui-move \u003Cfile\u003E \u003Cfrom\u003E \u003Cto\u003E moves or renames a control (subtree) ui-clone \u003Cfile\u003E \u003Ccontrol\u003E \u003Ccopies\u003E [out] copies a control; the copies are \u003Cname\u003E1, \u003Cname\u003E2, \u2026, each with its own properties ui-copy-subtree \u003Cdst\u003E \u003Csrc\u003E \u003Csrc root\u003E \u003Cnew root\u003E copies a subtree from another layout ui-inline \u003Cmain\u003E \u003Cref control\u003E \u003Ctemplate.ui\u003E \u003Ctemplate root\u003E [out] inlines a template layout ui-make-listbox \u003Cfile\u003E \u003Ccontainer\u003E \u003Crow\u003E \u003CtemplateName\u003E turns a static row into a list box with a row template Control paths in these commands are full layout paths such as MyWindow_main.LayoutRoot.Panel.OkButton.\nUI designer\nD3ModTool ui-designer [projectDir] [--port 5190] [--install DIR] opens the visual designer in your browser. It runs on http://127.0.0.1:5190, is only reachable from this PC, and is laid out like a forms designer:\nLeft\nToolbox: panel, image, button, text, check box, radio button, dropdown, list box and stack panel. Drag one onto the surface (it goes into the panel under the mouse), or click it to add it to the selected panel.\nLayouts: the game\u0027s layouts, which open read only (use Save as\u2026 into your mod to replace one), and the .ui files of your project.\nArt: every UI, item and minimap texture, plus the textures in your project. Click a frame to copy its name; Extract to project writes PNGs into \u003Cproject\u003E\\Art\\\u003CTexture\u003E\\.\nImport PNG\u2026 turns a picture (PNG, JPEG or WebP, up to 4096\u00D74096) into a new UI texture of a mod: \u003Cproject\u003E\\\u003Cmod\u003E\\data\\Base\\Textures\\2DUI_\u003Cname\u003E.tex, with one frame UI:\u003Cframe\u003E covering the picture. A new mod folder gets a mod.json.\nFrame names must be unique among all UI frames, because the game registers them by name, so a clash with the game or another project texture is refused.\nThe texture is stored uncompressed, which is large: 1600\u00D71200 is 7.7 MB.\nWhen you started from a property\u0027s \u2026 button, the new frame is assigned to it straight away. Project textures show on the canvas immediately; in the game they appear after mod-install / build_mods.\nCentre: the design surface. It draws the layout as the game places it, with real textures and text, on the chosen screen shape (the dashed box is the 4:3 design area).\nClick to select (Alt\u002Bclick picks the control below; Ctrl\u002Bclick or a drag on empty space selects several).\nDrag to move, and drag one of the 8 handles to resize. Arrow keys nudge by 1, or by 10 with Shift.\nWheel zooms; middle mouse or Space\u002Bdrag pans; 0 fits the view.\nPreview draws the screen like the game: no outlines, and controls the layout hides stay hidden. The window itself is always shown.\nRight\nOutline: the control tree. The eye on each row hides a control in the designer only, so you can work on what\u0027s below it (Alt\u002Bclick shows only that one among its siblings, e.g. one act of the loading screen); the file doesn\u0027t change. It collapses, drag a control onto another to move it inside, and it has Group (Ctrl\u002BG: the selected controls go into a new panel and keep their place on screen), Dup (Ctrl\u002BD) and Del.\nProperties: a grid in categories (Layout, Appearance, Text, Behavior, Template \u0026 style, Stack panel, Other values), with editors for each kind: anchors and alignment as lists, colours, check boxes, and a texture picker (\u2026) that opens the Art browser.\nInherited values are grey; editing one makes it the control\u0027s own, and \u00D7 removes the own value again.\nText keys show the text the player reads.\nNew\u2026 creates an empty layout (\u003CName\u003E_main.LayoutRoot) with a SNO id you choose, for a screen of your own.\nUndo / redo: Ctrl\u002BZ, Ctrl\u002BY. Save: Ctrl\u002BS.\nDeep links: \u2026/#stock/Vendor or \u2026/#custom/MyMod/data/Base/UI/X.ui, with an optional !\u003Ccontrol path\u003E to select a control.\nSaving writes the whole layout through the byte-exact writer: data the designer does not understand is kept as it was. Every save is validated first. New, grouped and moved controls are written in the same order as stock layouts (a parent before its children).\nNot modelled: positions the game sets in code at runtime (some buttons are moved by handlers) and list rows, which are created at runtime. Controls inside a stack panel are placed by the panel.\nRound trip\nD3ModTool ui-roundtrip \u003Cdir\u003E reads and rewrites every .ui under a folder and checks the bytes are identical. All 258 stock 2.8 layouts pass.\nArt and other assets\nUI art: the designer\u0027s Import PNG\u2026 (above) makes a new 2DUI_ texture.\nStatic props (3D models): import-gltf (below) turns a glTF model into a new actor.\nA mod can also draw any stock texture by name with draw_texture, and replace stock files with edited copies.\nModels: import-gltf\nD3ModTool import-gltf model.glb|.gltf modDir --name Name [--like actor] [--sno first id] [--scale s] [--actor-scale s] [--install DIR]\nIt turns a glTF 2.0 model into a static prop and writes three kinds of SNO files into the mod\u0027s data\\Base\\ folder:\nFile What Textures\\\u003CName\u003E_diff.tex One texture per material. It is DXT1, or DXT5 when the image has transparency, with a full mip chain down to a 4-pixel side. Appearance\\\u003CName\u003E.app The mesh, with one sub-object per glTF primitive and one material per glTF material. The texture goes in the diffuse slot. Actor\\\u003CName\u003E.acr An actor that uses the appearance. Spawn this one in the game. The new ids are added to mod.json \u0022adds\u0022.\nTemplate. Every field the tool does not understand is copied from a stock prop, so the new files differ from a known-good file only where they have to.\n--like names the template actor, by SNO id or name. The default is 61743 (a2dun_Aqd_Act_Post_B_02_Base): a non-interactive ServerProp with one mesh, no bones and one diffuse texture.\nThe template must be a type the server can spawn, such as ServerProp. Environment props don\u0027t work: the client places those itself from the scene data and ignores the server\u0027s copy, so they never appear. That\u0027s why 433 (Skeleton_1H_bonePile) can\u0027t be used. Confirmed in game on 2026-11-13: an obelisk built on 61743 shows up both with !spawn and when placed with the world editor.\nThe template must be that simple: one look, one material, one unskinned mesh, no bones, no collision or physics data. The tool refuses any other template.\nTemplates are read from the official install, which is only ever read.\nThe actor keeps the template\u0027s type, tags and collision settings. Its bounds are recomputed. Its PhysMesh is cleared. The Scale tag is set to --actor-scale (default 1).\nInput rules.\nglTF space: Y up, metres, counter-clockwise front faces, as Blender\u0027s exporter writes it.\nThe game is Z up, in feet. --scale defaults to 3.28084 (metres to feet). Use --scale 1 for a model made in feet.\nNode transforms are applied. Skins, animations, morph targets and texture transforms are ignored, with a warning.\nEach primitive needs POSITION. NORMAL is optional (smooth normals are computed when it is missing), and so is TEXCOORD_0. A sub-object holds at most 65,535 vertices.\nThe base color texture must be a PNG, either embedded or a file next to a .gltf. Other sizes are resized to powers of two, up to 2048. baseColorFactor is multiplied in. A material without a texture becomes a flat colour.\nOnly the base colour is used. Normal, emissive and metallic/roughness maps are ignored.\nIds. A re-import keeps the ids the mod\u0027s files already have. Otherwise the tool takes the first ids from --sno (default 600000) that are free in the game and in every mod folder next to this one. The names must not already exist in the game.\nGetting it into the game:\nmod-install \u003CmodDir\u003E --client \u003Cgame copy\u003E builds it into the game copy.\nPoint the server\u0027s [Storage] GameInstallPath at the same game copy, so it knows the new actor.\nSpawn the actor, e.g. GM command !spawn \u003Cactor id\u003E, or place it with the DevHub world editor.\nThe new actor is not interactive and has no collision mesh.\n","sections":[{"id":"game-data--layout","title":"Layout"},{"id":"game-data--add-or-replace","title":"Add or replace"},{"id":"game-data--building","title":"Building"},{"id":"game-data--ui-layout-tools","title":"UI layout tools"},{"id":"game-data--ui-designer","title":"UI designer"},{"id":"game-data--round-trip","title":"Round trip"},{"id":"game-data--art-and-other-assets","title":"Art and other assets"},{"id":"game-data--models-import-gltf","title":"Models: import-gltf"}]},{"id":"tools","title":"Tools","html":"\u003Ch1 id=\u0022tools\u0022\u003ETools\u003C/h1\u003E\n\u003Ch2 id=\u0022tools--building-the-kit\u0022\u003EBuilding the kit\u003C/h2\u003E\n\u003Cp\u003E\u003Ccode\u003Escripts\\build.ps1\u003C/code\u003E builds the host (\u003Ccode\u003Ehost\\target\\release\u003C/code\u003E), D3ModTool (\u003Ccode\u003Etools\\D3ModTool\\out\u003C/code\u003E) and these docs. It needs Rust and the .NET 8 SDK. \u003Ccode\u003Escripts\\package.ps1 [-Zip]\u003C/code\u003E assembles a binary release in \u003Ccode\u003Edist\\\u003C/code\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022tools--paths\u0022\u003EPaths\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EVariable\u003C/th\u003E\n\u003Cth\u003EUsed for\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003ED3_CLIENT_DIR\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EThe game copy mods are built into: the default for every \u003Ccode\u003E--client\u003C/code\u003E option.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003ED3_SERVER_DIR\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EThe server folder (with \u003Ccode\u003EBlizzless.dll\u003C/code\u003E) that server mod projects reference.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003ED3_INSTALL_DIR\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EThe official install, which the tools read and never write. Default: the install Windows has registered (the \u0026quot;Diablo III\u0026quot; uninstall entry), else \u003Ccode\u003EC:\\Program Files (x86)\\Diablo III\u003C/code\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch2 id=\u0022tools--d3modtool\u0022\u003ED3ModTool\u003C/h2\u003E\n\u003Cp\u003EThe ModKit\u0027s command line tool (\u003Ccode\u003ED3ModTool.exe\u003C/code\u003E, .NET 8). Options take the form \u003Ccode\u003E--name value\u003C/code\u003E. Every \u003Ccode\u003E--client DIR\u003C/code\u003E defaults to \u003Ccode\u003E%D3_CLIENT_DIR%\u003C/code\u003E.\u003C/p\u003E\n\u003Ch3 id=\u0022tools--mods\u0022\u003EMods\u003C/h3\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ECommand\u003C/th\u003E\n\u003Cth\u003EDoes\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Emod-install \u0026lt;modDir\u0026gt;... [--server DIR] [--client DIR] [--data no]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EInstalls mods into a server and/or game copy (\u003Ccode\u003EMods\\\u0026lt;id\u0026gt;\u003C/code\u003E), then rebuilds the game\u0027s data from every installed mod (skip that with \u003Ccode\u003E--data no\u003C/code\u003E).\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Emod-uninstall \u0026lt;id\u0026gt;... [--server DIR] [--client DIR]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ERemoves installed mods; the game\u0027s data is rebuilt without them.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Emod-data [--client DIR]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ERebuilds the game copy\u0027s data from \u003Ccode\u003E\u0026lt;game\u0026gt;\\Mods\\*\\data\u003C/code\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Emodhost-install \u0026lt;hostDir\u0026gt; [--client DIR]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ECopies \u003Ccode\u003ED3ModHost.dll\u003C/code\u003E and \u003Ccode\u003Ed3inject.exe\u003C/code\u003E to \u003Ccode\u003E\u0026lt;game\u0026gt;\\ModHost\u003C/code\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Emod-build \u0026lt;modDir\u0026gt;... [--client DIR]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ELow level: builds the given mod source folders\u0027 data into the game copy, in argument order.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Emod-verify [--client DIR]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EChecks the built storage.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Emod-restore [--client DIR]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EReturns the game copy\u0027s storage to stock.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecasc-selftest [client]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EProves the storage writer rebuilds stock files byte for byte.\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch3 id=\u0022tools--game-data\u0022\u003EGame data\u003C/h3\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ECommand\u003C/th\u003E\n\u003Cth\u003EDoes\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ecasc-extract \u0026lt;group\u0026gt; \u0026lt;nameRegex\u0026gt; \u0026lt;outDir\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EExtracts stock SNO files from the installed game, e.g. \u003Ccode\u003Ecasc-extract UI \u0026quot;^BattleNetCampaign$\u0026quot; out\u003C/code\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eimport-gltf \u0026lt;model.glb\\|.gltf\u0026gt; \u0026lt;modDir\u0026gt; --name \u0026lt;Name\u0026gt; [--like \u0026lt;actor\u0026gt;] [--sno \u0026lt;id\u0026gt;] [--scale \u0026lt;s\u0026gt;] [--actor-scale \u0026lt;s\u0026gt;] [--install DIR]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ETurns a glTF model into a new static prop: a texture, an appearance and an actor in the mod\u0027s \u003Ccode\u003Edata\\\u003C/code\u003E. See \u003Ca href=\u0022#game-data--models-import-gltf\u0022\u003EGame data\u003C/a\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-*\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ELayout editing; see \u003Ca href=\u0022#game-data--ui-layout-tools\u0022\u003EGame data\u003C/a\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-designer [projectDir] [--port N] [--install DIR] [--browser no]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EThe visual UI designer; see \u003Ca href=\u0022#game-data--ui-designer\u0022\u003EGame data\u003C/a\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eui-roundtrip \u0026lt;dir\u0026gt;\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EChecks that every \u003Ccode\u003E.ui\u003C/code\u003E under the folder writes back byte-exact.\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch3 id=\u0022tools--docs\u0022\u003EDocs\u003C/h3\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ECommand\u003C/th\u003E\n\u003Cth\u003EDoes\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edocs-build [srcDir] [out.html]\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EBuilds these docs from \u003Ccode\u003EModKit\\docs\\src\\*.md\u003C/code\u003E into one HTML page (default \u003Ccode\u003EModKit\\docs\\index.html\u003C/code\u003E).\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch2 id=\u0022tools--d3inject\u0022\u003Ed3inject\u003C/h2\u003E\n\u003Cpre\u003E\u003Ccode\u003Ed3inject.exe \u0026lt;game exe\u0026gt; \u0026lt;D3ModHost.dll\u0026gt; [game arguments...]\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003EStarts the game suspended, loads the host DLL into it, then resumes it. Launchers call this; the arguments after the DLL go to the game (\u003Ccode\u003EOnlineService.SSO=true -launch -uid diablo3\u003C/code\u003E).\u003C/p\u003E\n\u003Ch2 id=\u0022tools--host-environment-variables\u0022\u003EHost environment variables\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EVariable\u003C/th\u003E\n\u003Cth\u003EEffect\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003ED3MODS_ROOT\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ELoad client mods from this folder instead of \u003Ccode\u003E\u0026lt;game\u0026gt;\\Mods\u003C/code\u003E.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003ED3MODS_DISABLE\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EComma-separated mod ids not to load.\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003ED3MODHOST_NOHOOK\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ELoad the host but patch nothing (diagnostics).\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch2 id=\u0022tools--log-files\u0022\u003ELog files\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EFile\u003C/th\u003E\n\u003Cth\u003EContents\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E\u0026lt;game\u0026gt;\\D3ModHost.log\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ehost: mods loaded, handlers bound or wrapped, every plugin\u0027s \u003Ccode\u003Elog\u003C/code\u003E lines\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E\u0026lt;game\u0026gt;\\x64\\D3Debug.txt\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe game\u0027s own log\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003E\u0026lt;server\u0026gt;\\logs\\\u0026lt;time\u0026gt;\\\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ethe server\u0027s logs, including \u003Ccode\u003E[Mods]\u003C/code\u003E and your mod logger\u0027s lines\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n","text":"Tools\nBuilding the kit\nscripts\\build.ps1 builds the host (host\\target\\release), D3ModTool (tools\\D3ModTool\\out) and these docs. It needs Rust and the .NET 8 SDK. scripts\\package.ps1 [-Zip] assembles a binary release in dist\\.\nPaths\nVariable Used for D3_CLIENT_DIR The game copy mods are built into: the default for every --client option. D3_SERVER_DIR The server folder (with Blizzless.dll) that server mod projects reference. D3_INSTALL_DIR The official install, which the tools read and never write. Default: the install Windows has registered (the \u0022Diablo III\u0022 uninstall entry), else C:\\Program Files (x86)\\Diablo III. D3ModTool\nThe ModKit\u0027s command line tool (D3ModTool.exe, .NET 8). Options take the form --name value. Every --client DIR defaults to %D3_CLIENT_DIR%.\nMods\nCommand Does mod-install \u003CmodDir\u003E... [--server DIR] [--client DIR] [--data no] Installs mods into a server and/or game copy (Mods\\\u003Cid\u003E), then rebuilds the game\u0027s data from every installed mod (skip that with --data no). mod-uninstall \u003Cid\u003E... [--server DIR] [--client DIR] Removes installed mods; the game\u0027s data is rebuilt without them. mod-data [--client DIR] Rebuilds the game copy\u0027s data from \u003Cgame\u003E\\Mods\\*\\data. modhost-install \u003ChostDir\u003E [--client DIR] Copies D3ModHost.dll and d3inject.exe to \u003Cgame\u003E\\ModHost. mod-build \u003CmodDir\u003E... [--client DIR] Low level: builds the given mod source folders\u0027 data into the game copy, in argument order. mod-verify [--client DIR] Checks the built storage. mod-restore [--client DIR] Returns the game copy\u0027s storage to stock. casc-selftest [client] Proves the storage writer rebuilds stock files byte for byte. Game data\nCommand Does casc-extract \u003Cgroup\u003E \u003CnameRegex\u003E \u003CoutDir\u003E Extracts stock SNO files from the installed game, e.g. casc-extract UI \u0022^BattleNetCampaign$\u0022 out. import-gltf \u003Cmodel.glb\\|.gltf\u003E \u003CmodDir\u003E --name \u003CName\u003E [--like \u003Cactor\u003E] [--sno \u003Cid\u003E] [--scale \u003Cs\u003E] [--actor-scale \u003Cs\u003E] [--install DIR] Turns a glTF model into a new static prop: a texture, an appearance and an actor in the mod\u0027s data\\. See Game data. ui-* Layout editing; see Game data. ui-designer [projectDir] [--port N] [--install DIR] [--browser no] The visual UI designer; see Game data. ui-roundtrip \u003Cdir\u003E Checks that every .ui under the folder writes back byte-exact. Docs\nCommand Does docs-build [srcDir] [out.html] Builds these docs from ModKit\\docs\\src\\*.md into one HTML page (default ModKit\\docs\\index.html). d3inject\nd3inject.exe game exe D3ModHost.dll [game arguments...]\nStarts the game suspended, loads the host DLL into it, then resumes it. Launchers call this; the arguments after the DLL go to the game (OnlineService.SSO=true -launch -uid diablo3).\nHost environment variables\nVariable Effect D3MODS_ROOT Load client mods from this folder instead of \u003Cgame\u003E\\Mods. D3MODS_DISABLE Comma-separated mod ids not to load. D3MODHOST_NOHOOK Load the host but patch nothing (diagnostics). Log files\nFile Contents \u003Cgame\u003E\\D3ModHost.log host: mods loaded, handlers bound or wrapped, every plugin\u0027s log lines \u003Cgame\u003E\\x64\\D3Debug.txt the game\u0027s own log \u003Cserver\u003E\\logs\\\u003Ctime\u003E\\ the server\u0027s logs, including [Mods] and your mod logger\u0027s lines ","sections":[{"id":"tools--building-the-kit","title":"Building the kit"},{"id":"tools--paths","title":"Paths"},{"id":"tools--d3modtool","title":"D3ModTool"},{"id":"tools--d3inject","title":"d3inject"},{"id":"tools--host-environment-variables","title":"Host environment variables"},{"id":"tools--log-files","title":"Log files"}]},{"id":"languages","title":"Languages","html":"\u003Ch1 id=\u0022languages\u0022\u003ELanguages\u003C/h1\u003E\n\u003Cp\u003EA client plugin is a native 64-bit Windows DLL that exports \u003Ccode\u003Ed3mod_init\u003C/code\u003E. Any language that can produce one works. A server part is a .NET 8 assembly, so C# (or F#, or VB) works there.\u003C/p\u003E\n\u003Ch2 id=\u0022languages--rust-reference\u0022\u003ERust (reference)\u003C/h2\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-toml\u0022\u003E[lib]\ncrate-type = [\u0026quot;cdylib\u0026quot;]\n\n[dependencies]\nd3modapi = { path = \u0026quot;\u0026lt;ModKit\u0026gt;/sdk/rust/d3modapi\u0026quot; }\n\n[profile.release]\npanic = \u0026quot;abort\u0026quot;\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-rust\u0022\u003Euse d3modapi as api;\n\n#[no_mangle]\npub unsafe extern \u0026quot;C\u0026quot; fn d3mod_init(host: *const api::HostApi, id: *const std::ffi::c_char, dir: *const std::ffi::c_char) -\u0026gt; i32 {\n    if !api::set_api(host, id) { return 1; }\n    api::log(\u0026quot;hello\u0026quot;);\n    0\n}\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003EHandlers are \u003Ccode\u003Eunsafe extern \u0026quot;system\u0026quot; fn(usize, usize, usize, usize) -\u0026gt; usize\u003C/code\u003E. Use \u003Ccode\u003Epanic = \u0026quot;abort\u0026quot;\u003C/code\u003E: a panic must never unwind into the game.\u003C/p\u003E\n\u003Ch2 id=\u0022languages--c-c\u0022\u003EC / C\u002B\u002B\u003C/h2\u003E\n\u003Cp\u003EInclude \u003Ccode\u003Esdk/c/d3modapi.h\u003C/code\u003E and export the entry point:\u003C/p\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-c\u0022\u003E#include \u0026quot;d3modapi.h\u0026quot;\n\nstatic const D3HostApi *api;\n\nstatic uintptr_t on_click(uintptr_t rcx, uintptr_t rdx, uintptr_t r8, uintptr_t r9) {\n    api-\u0026gt;log(\u0026quot;[my-mod] clicked\u0026quot;);\n    return 0;\n}\n\n__declspec(dllexport) int32_t d3mod_init(const D3HostApi *a, const char *mod_id, const char *mod_dir) {\n    if (!a || a-\u0026gt;version \u0026lt; D3MODAPI_VERSION) return 1;\n    api = a;\n    api-\u0026gt;register_handler(\u0026quot;MyMod_OnClick\u0026quot;, on_click);\n    return 0;\n}\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003EBuild a 64-bit DLL, for example \u003Ccode\u003Ecl /LD /O2 mymod.c /Fe:mymod.dll\u003C/code\u003E.\u003C/p\u003E\n\u003Ch2 id=\u0022languages--c-nativeaot\u0022\u003EC# (NativeAOT)\u003C/h2\u003E\n\u003Cp\u003ENativeAOT compiles C# to a native DLL with real exports. The game needs no .NET runtime. Add \u003Ccode\u003Esdk/csharp/D3ModApi.cs\u003C/code\u003E to the project:\u003C/p\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-xml\u0022\u003E\u0026lt;PropertyGroup\u0026gt;\n  \u0026lt;TargetFramework\u0026gt;net8.0\u0026lt;/TargetFramework\u0026gt;\n  \u0026lt;PublishAot\u0026gt;true\u0026lt;/PublishAot\u0026gt;\n  \u0026lt;AllowUnsafeBlocks\u0026gt;true\u0026lt;/AllowUnsafeBlocks\u0026gt;\n  \u0026lt;RuntimeIdentifier\u0026gt;win-x64\u0026lt;/RuntimeIdentifier\u0026gt;\n\u0026lt;/PropertyGroup\u0026gt;\n\u0026lt;ItemGroup\u0026gt;\n  \u0026lt;Compile Include=\u0026quot;\u0026lt;ModKit\u0026gt;\\sdk\\csharp\\D3ModApi.cs\u0026quot; /\u0026gt;\n\u0026lt;/ItemGroup\u0026gt;\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cpre\u003E\u003Ccode class=\u0022language-csharp\u0022\u003E[UnmanagedCallersOnly(EntryPoint = \u0026quot;d3mod_init\u0026quot;, CallConvs = new[] { typeof(CallConvCdecl) })]\npublic static unsafe int Init(D3HostApi* api, byte* modId, byte* modDir)\n{\n    if (!D3.Init(api, modId)) return 1;\n    D3.RegisterWrapper(\u0026quot;UIBattlenet_Campaign_OnUpdate\u0026quot;, \u0026amp;MenuUpdate);\n    return 0;\n}\n\n[UnmanagedCallersOnly]\nstatic nuint MenuUpdate(delegate* unmanaged\u0026lt;nuint, nuint, nuint, nuint, nuint\u0026gt; original, nuint a, nuint b, nuint c, nuint d)\n    =\u0026gt; original(a, b, c, d);\n\u003C/code\u003E\u003C/pre\u003E\n\u003Cp\u003EBuild with \u003Ccode\u003Edotnet publish -c Release -r win-x64\u003C/code\u003E; the DLL is in the publish folder. The NativeAOT linker needs the MSVC build tools, and \u003Ccode\u003Evswhere.exe\u003C/code\u003E (in \u003Ccode\u003E%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\u003C/code\u003E) on PATH.\u003C/p\u003E\n\u003Cp\u003ERules for C# handlers:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003EThey must be \u003Ccode\u003Estatic\u003C/code\u003E and \u003Ccode\u003E[UnmanagedCallersOnly]\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003EThey must not throw: catch everything.\u003C/li\u003E\n\u003Cli\u003EThey must not block.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EThe DLL is about 1 MB, because it carries its own small runtime.\u003C/p\u003E\n\u003Ch2 id=\u0022languages--other-languages\u0022\u003EOther languages\u003C/h2\u003E\n\u003Cp\u003EZig, Go (\u003Ccode\u003E-buildmode=c-shared\u003C/code\u003E), Nim, Odin and Delphi all work if they can:\u003C/p\u003E\n\u003Col\u003E\n\u003Cli\u003Eexport a C function named \u003Ccode\u003Ed3mod_init\u003C/code\u003E, and\u003C/li\u003E\n\u003Cli\u003Emirror the \u003Ccode\u003ED3HostApi\u003C/code\u003E struct from \u003Ccode\u003Ed3modapi.h\u003C/code\u003E (field order matters; every field is a pointer-sized function pointer, except the leading \u003Ccode\u003Euint32_t version\u003C/code\u003E followed by padding to 8 bytes).\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cp\u003ECallbacks use the Windows x64 calling convention.\u003C/p\u003E\n","text":"Languages\nA client plugin is a native 64-bit Windows DLL that exports d3mod_init. Any language that can produce one works. A server part is a .NET 8 assembly, so C# (or F#, or VB) works there.\nRust (reference)\n[lib]\ncrate-type = [cdylib]\n\n[dependencies]\nd3modapi = { path = ModKit/sdk/rust/d3modapi }\n\n[profile.release]\npanic = abort\nuse d3modapi as api;\n\n#[no_mangle]\npub unsafe extern C fn d3mod_init(host: *const api::HostApi, id: *const std::ffi::c_char, dir: *const std::ffi::c_char) - i32 {\n    if !api::set_api(host, id) { return 1; }\n    api::log(hello);\n    0\n}\nHandlers are unsafe extern \u0022system\u0022 fn(usize, usize, usize, usize) -\u003E usize. Use panic = \u0022abort\u0022: a panic must never unwind into the game.\nC / C\u002B\u002B\nInclude sdk/c/d3modapi.h and export the entry point:\n#include d3modapi.h\n\nstatic const D3HostApi *api;\n\nstatic uintptr_t on_click(uintptr_t rcx, uintptr_t rdx, uintptr_t r8, uintptr_t r9) {\n    api-log([my-mod] clicked);\n    return 0;\n}\n\n__declspec(dllexport) int32_t d3mod_init(const D3HostApi *a, const char *mod_id, const char *mod_dir) {\n    if (!a || a-version  D3MODAPI_VERSION) return 1;\n    api = a;\n    api-register_handler(MyMod_OnClick, on_click);\n    return 0;\n}\nBuild a 64-bit DLL, for example cl /LD /O2 mymod.c /Fe:mymod.dll.\nC# (NativeAOT)\nNativeAOT compiles C# to a native DLL with real exports. The game needs no .NET runtime. Add sdk/csharp/D3ModApi.cs to the project:\nPropertyGroup\n  TargetFrameworknet8.0/TargetFramework\n  PublishAottrue/PublishAot\n  AllowUnsafeBlockstrue/AllowUnsafeBlocks\n  RuntimeIdentifierwin-x64/RuntimeIdentifier\n/PropertyGroup\nItemGroup\n  Compile Include=ModKit\\sdk\\csharp\\D3ModApi.cs /\n/ItemGroup\n[UnmanagedCallersOnly(EntryPoint = d3mod_init, CallConvs = new[] { typeof(CallConvCdecl) })]\npublic static unsafe int Init(D3HostApi* api, byte* modId, byte* modDir)\n{\n    if (!D3.Init(api, modId)) return 1;\n    D3.RegisterWrapper(UIBattlenet_Campaign_OnUpdate, MenuUpdate);\n    return 0;\n}\n\n[UnmanagedCallersOnly]\nstatic nuint MenuUpdate(delegate* unmanagednuint, nuint, nuint, nuint, nuint original, nuint a, nuint b, nuint c, nuint d)\n    = original(a, b, c, d);\nBuild with dotnet publish -c Release -r win-x64; the DLL is in the publish folder. The NativeAOT linker needs the MSVC build tools, and vswhere.exe (in %ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer) on PATH.\nRules for C# handlers:\nThey must be static and [UnmanagedCallersOnly].\nThey must not throw: catch everything.\nThey must not block.\nThe DLL is about 1 MB, because it carries its own small runtime.\nOther languages\nZig, Go (-buildmode=c-shared), Nim, Odin and Delphi all work if they can:\nexport a C function named d3mod_init, and\nmirror the D3HostApi struct from d3modapi.h (field order matters; every field is a pointer-sized function pointer, except the leading uint32_t version followed by padding to 8 bytes).\nCallbacks use the Windows x64 calling convention.\n","sections":[{"id":"languages--rust-reference","title":"Rust (reference)"},{"id":"languages--c-c","title":"C / C\u002B\u002B"},{"id":"languages--c-nativeaot","title":"C# (NativeAOT)"},{"id":"languages--other-languages","title":"Other languages"}]},{"id":"examples","title":"Examples","html":"\u003Ch1 id=\u0022examples\u0022\u003EExamples\u003C/h1\u003E\n\u003Ch2 id=\u0022examples--gold-rate-server-hook-rust-client\u0022\u003Egold-rate (server hook \u002B Rust client)\u003C/h2\u003E\n\u003Cp\u003E\u003Ccode\u003Eexamples/gold-rate\u003C/code\u003E: multiplies every gold drop by \u003Ccode\u003Esettings.json\u003C/code\u003E\u0027s \u003Ccode\u003Emultiplier\u003C/code\u003E (default 3).\u003C/p\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EFile\u003C/th\u003E\n\u003Cth\u003EShows\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Emod.json\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Ea mod with both code parts\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Esettings.json\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003Esettings shared by both parts, installed next to \u003Ccode\u003Emod.json\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eserver-src/GoldRateMod.cs\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003EIServerMod\u003C/code\u003E, reading settings from \u003Ccode\u003Econtext.Directory\u003C/code\u003E, \u003Ccode\u003Econtext.Hooks.OnGoldDrop\u003C/code\u003E, a \u003Ccode\u003E[CommandGroup]\u003C/code\u003E (\u003Ccode\u003E!goldrate\u003C/code\u003E, \u003Ccode\u003E!goldrate set 5\u003C/code\u003E)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eclient-src/src/lib.rs\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Ed3mod_init\u003C/code\u003E, reading \u003Ccode\u003Emod_dir\u003C/code\u003E, wrapping \u003Ccode\u003EUIBattlenet_Campaign_OnUpdate\u003C/code\u003E, \u003Ccode\u003Efind\u003C/code\u003E \u002B \u003Ccode\u003Eset_text\u003C/code\u003E on the Start Game button\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch2 id=\u0022examples--hello-csharp-c-client\u0022\u003Ehello-csharp (C# client)\u003C/h2\u003E\n\u003Cp\u003E\u003Ccode\u003Eexamples/hello-csharp\u003C/code\u003E: a client-only plugin in C#, built with NativeAOT. It w
